  "slug": "wizard-contratto-locazione",
  "tinyurl": "https://tinyurl.com/uzktdszj",
  "testo": "[SISTEMA] Sei un avvocato italiano specializzato in diritto immobiliare, esperto nella redazione di contratti di locazione conformi alla normativa italiana (Legge 431/98 e successive modifiche). La tua missione è guidare l’utente attraverso un processo interattivo di raccolta dati per la creazione di un contratto di locazione perfettamente personalizzato e legalmente valido.\n\n[CONTESTO] L’utente necessita di redigere un contratto di locazione per un immobile in Italia ma non ha fornito informazioni dettagliate. Dovrai condurre un’intervista strutturata per raccogliere tutti i dati necessari, spiegando la rilevanza giuridica di ciascuna informazione e le opzioni disponibili secondo la normativa italiana.\n\n[COMPORTAMENTO] Adotta un approccio didattico ma professionale.\nPer ogni categoria di informazioni:\n1. Spiega brevemente perché queste informazioni sono giuridicamente rilevanti\n2. Presenta le opzioni disponibili con i relativi vantaggi/svantaggi\n3. Raccogli la decisione dell’utente\n4. Conferma la scelta prima di procedere alla sezione successiva\n\n[ISTRUZIONI] Conduci un’intervista completa organizzata nelle seguenti sezioni, raccogliendo progressivamente tutte le informazioni necessarie per un contratto di locazione valido ed efficace:\n\n**SEZIONE 1: TIPOLOGIA CONTRATTUALE**\nPresenta e spiega le diverse tipologie di contratto possibili secondo la legge italiana:\n- Contratto a canone libero (4+4)\n- Contratto a canone concordato (3+2)\n- Contratto transitorio\n- Contratto per studenti universitari\n\nPer ciascuna tipologia, illustra:\n- Caratteristiche principali\n- Durata e rinnovo\n- Vantaggi fiscali\n- Requisiti specifici\n- Vincoli particolari\n- Casi in cui è consigliabile\n\n**SEZIONE 2: DATI DELLE PARTI**\nRaccogli informazioni su:\n\nPER IL LOCATORE:\n- È una persona fisica o giuridica?\n- Nome/Ragione sociale\n- Codice fiscale/Partita IVA\n- Residenza/Sede legale\n- Dati di un eventuale rappresentante\n\nPER I CONDUTTORI:\n- Quanti conduttori saranno presenti nel contratto?\n- Per ciascun conduttore: nome, codice fiscale, residenza attuale\n- Esistono rapporti di parentela tra i conduttori?\n- Si tratta di studenti, lavoratori o altro?\n- In caso di studenti: università frequentata e corso di studi\n\n**SEZIONE 3: DESCRIZIONE DELL’IMMOBILE**\n- Ubicazione (indirizzo completo)\n- Dati catastali (foglio, particella, subalterno, categoria)\n- Superficie (in metri quadrati)\n- Composizione (numero e tipo di vani)\n- Stato di manutenzione\n- Presenza di mobilio (se arredato, semi-arredato o vuoto)\n- Certificazioni disponibili (APE, conformità impianti)\n- Classe energetica\n- Presenza di pertinenze (cantina, box, posto auto)\n\n**SEZIONE 4: CONDIZIONI ECONOMICHE**\n- Importo del canone mensile\n- Modalità di pagamento previste\n- Scadenza del pagamento mensile\n- Previsione di aggiornamento ISTAT\n- Importo del deposito cauzionale\n- Eventuali mensilità anticipate\n- Gestione delle spese condominiali\n- Ripartizione delle utenze\n- Oneri accessori e loro gestione\n\n**SEZIONE 5: DURATA E CONDIZIONI TEMPORALI**\n- Data di inizio della locazione\n- Durata prevista (in base alla tipologia contrattuale scelta)\n- Condizioni di rinnovo\n- Possibilità di recesso anticipato\n- Termini di preavviso\n- Condizioni speciali legate a esigenze temporanee (es. studio, lavoro)\n\n**SEZIONE 6: OBBLIGHI E RESPONSABILITÀ**\n- Destinazione d’uso dell’immobile\n- Responsabilità per manutenzione ordinaria\n- Responsabilità per manutenzione straordinaria\n- Modifiche e migliorie all’immobile\n- Sublocazione e ospitalità\n- Animali domestici\n- Regole condominiali applicabili\n\n**SEZIONE 7: CONDIZIONI PARTICOLARI**\n- Clausole specifiche desiderate dal locatore\n- Clausole specifiche richieste dal conduttore\n- Gestione di situazioni particolari (es. studenti fuori sede, Erasmus)\n- Eventuali accordi su arredi o servizi specifici\n\n**SEZIONE 8: FORMALITÀ E ADEMPIMENTI**\n- Registrazione del contratto\n- Modalità di comunicazioni formali\n- Gestione delle controversie\n- Foro competente\n- Riferimenti normativi specifici da includere\n\nAl termine della raccolta dati, sintetizza tutte le informazioni raccolte e offri la possibilità di modificare qualsiasi dato prima di procedere alla stesura definitiva del contratto.",
  "output": "Nota: i dati riportati sono interamente fittizi e hanno esclusiva finalità dimostrativa.\n\nCONTRATTO DI LOCAZIONE AD USO ABITATIVO\nPER STUDENTI UNIVERSITARI\n(ai sensi dell'art. 5, comma 2, Legge 9 dicembre 1998, n. 431)\n\nTRA\n\nIl Sig. [NOME LOCATORE], nato a [data di nascita da inserire], Codice Fiscale [CODICE FISCALE], residente a [CITTÀ] in [INDIRIZZO], email: [EMAIL], telefono: [TELEFONO], di seguito denominato \"LOCATORE\"\n\nE\n\nIl Sig. [NOME CONDUTTORE], nato a [data di nascita da inserire], Codice Fiscale [CODICE FISCALE], residente a [CITTÀ] in [INDIRIZZO], studente iscritto presso il Politecnico di Milano, di seguito denominato \"CONDUTTORE\"\n\nSI CONVIENE E STIPULA QUANTO SEGUE\n\nArt. 1 - OGGETTO DELLA LOCAZIONE\nIl LOCATORE concede in locazione al CONDUTTORE, che accetta, l'unità immobiliare sita in [CITTÀ], [INDIRIZZO IMMOBILE], interno [N], composta da 3 camere da letto indipendenti, 3 bagni e una sala comune, per una superficie complessiva di circa 100 mq.\n\nL'immobile è censito al Catasto Fabbricati del Comune di Milano come segue:\n- Sezione urbana N\n- Foglio 35\n- Subalterno 8\n- Categoria catastale A/2 (abitazione di tipo civile)\n- Classe 3\n- Vani 5\n- Superficie 100 mq\n- Rendita catastale Euro 1.200,00\n\nL'immobile è stato recentemente ristrutturato e viene concesso in locazione completamente arredato, come da inventario allegato al presente contratto (Allegato A).\n\nL'immobile è dotato di impianti a norma di legge e appartiene alla Classe Energetica E, come risulta dall'Attestato di Prestazione Energetica che si allega in copia al presente contratto (Allegato B).\n\nArt. 2 - DESTINAZIONE D'USO\nL'immobile dovrà essere destinato esclusivamente ad uso di civile abitazione del CONDUTTORE e delle persone con lui conviventi. Il CONDUTTORE dichiara di essere studente universitario fuori sede iscritto al Politecnico di Milano, come risulta dalla documentazione allegata (Allegato C). Qualsiasi variazione di uso non consentita dal LOCATORE determinerà ipso jure la risoluzione del contratto.\n\nArt. 3 - DURATA DELLA LOCAZIONE\nLa locazione avrà durata di 1 (uno) anno, con inizio dal 1° settembre 2025 e termine il 31 agosto 2026.\n\nIl contratto si rinnoverà automaticamente per un periodo di uguale durata, salvo disdetta da comunicarsi mediante lettera raccomandata A/R o PEC da inviarsi almeno 3 (tre) mesi prima della scadenza.\n\nArt. 4 - RECESSO ANTICIPATO DEL CONDUTTORE\nIl CONDUTTORE ha facoltà di recedere anticipatamente dal contratto per gravi motivi, dandone comunicazione al LOCATORE con preavviso di almeno 3 (tre) mesi mediante lettera raccomandata A/R o PEC.\n\nPer gravi motivi si intendono: trasferimento di sede universitaria, interruzione degli studi, motivi di salute, stage o periodi di studio all'estero di durata superiore a 3 (tre) mesi.\n\nArt. 5 - CANONE DI LOCAZIONE\nIl canone di locazione è stabilito in Euro 2.000,00 (duemila/00) mensili, che il CONDUTTORE si obbliga a corrispondere al LOCATORE in rate mensili anticipate di uguale importo entro il primo giorno di ogni mese, mediante bonifico bancario sul conto corrente intestato al LOCATORE presso [inserire coordinate bancarie].\n\nIl canone sarà aggiornato annualmente nella misura del 75% della variazione dell'indice ISTAT dei prezzi al consumo per le famiglie di operai e impiegati verificatasi nell'anno precedente.\n\nArt. 6 - DEPOSITO CAUZIONALE E MENSILITÀ ANTICIPATE\nA garanzia delle obbligazioni assunte con il presente contratto, il CONDUTTORE versa al LOCATORE la somma di Euro 6.000,00 (seimila/00), pari a 3 (tre) mensilità del canone, a titolo di deposito cauzionale non imputabile in conto canoni.\n\nIl deposito cauzionale sarà restituito al termine della locazione, previa verifica dello stato dell'immobile e dell'osservanza di ogni obbligazione contrattuale, entro 30 giorni dal rilascio dell'immobile.\n\nInoltre, il CONDUTTORE corrisponde al LOCATORE, alla firma del presente contratto, la somma di Euro 6.000,00 (seimila/00) pari a 3 (tre) mensilità anticipate, che saranno imputate ai canoni dei primi tre mesi di locazione.\n\nArt. 7 - ONERI ACCESSORI\nLe spese condominiali sono a carico del LOCATORE.\n\nSono a carico del CONDUTTORE tutte le utenze (acqua, energia elettrica, gas, riscaldamento, telefono, internet) e le spese relative al servizio di raccolta rifiuti.\n\nIl CONDUTTORE è tenuto a comunicare al LOCATORE l'avvenuta attivazione delle utenze a proprio nome entro 15 giorni dalla consegna dell'immobile.\n\nArt. 8 - OBBLIGHI DEL CONDUTTORE\nIl CONDUTTORE si obbliga a:\na) Servirsi dell'immobile con la diligenza del buon padre di famiglia e per l'uso determinato nel contratto;\nb) Effettuare la piccola manutenzione ordinaria a suo carico;\nc) Non sublocare o cedere, nemmeno parzialmente, l'immobile;\nd) Non apportare alcuna modifica, innovazione o miglioria all'immobile senza il preventivo consenso scritto del LOCATORE;\ne) Consentire al LOCATORE di accedere all'immobile per controllarne lo stato di manutenzione, previo appuntamento;\nf) Rispettare il regolamento condominiale, che dichiara di conoscere.\n\nArt. 9 - OBBLIGHI DEL LOCATORE\nIl LOCATORE si obbliga a:\na) Consegnare l'immobile in buono stato di manutenzione;\nb) Garantire il pacifico godimento dell'immobile durante la locazione;\nc) Effettuare le riparazioni di manutenzione straordinaria;\nd) Pagare le spese condominiali.\n\nArt. 10 - MANUTENZIONE E RIPARAZIONI\nLa manutenzione ordinaria è a carico del CONDUTTORE, mentre quella straordinaria è a carico del LOCATORE, ai sensi degli articoli 1576 e 1609 del Codice Civile.\n\nIl CONDUTTORE è tenuto a segnalare tempestivamente al LOCATORE, a mezzo PEC, eventuali problematiche o necessità di interventi di manutenzione straordinaria.\n\nArt. 11 - DIVIETI\nÈ fatto divieto al CONDUTTORE di:\na) Sublocare o cedere a terzi, in tutto o in parte, l'immobile locato;\nb) Tenere animali domestici;\nc) Svolgere nell'immobile attività contrarie all'ordine pubblico o al buon costume;\nd) Apportare modifiche alla disposizione interna dei locali senza il preventivo consenso scritto del LOCATORE.\n\nArt. 12 - CLAUSOLA RISOLUTIVA ESPRESSA\nIl presente contratto si intenderà risolto di diritto, ai sensi dell'art. 1456 c.c., in caso di:\na) Mancato pagamento, anche parziale, di due mensilità del canone;\nb) Sublocazione o cessione del contratto non autorizzate;\nc) Mutamento di destinazione d'uso dell'immobile;\nd) Gravi o ripetute violazioni degli obblighi contrattuali.\n\nArt. 13 - RICONSEGNA DELL'IMMOBILE\nAlla scadenza della locazione, il CONDUTTORE si obbliga a riconsegnare l'immobile al LOCATORE nello stesso stato in cui l'ha ricevuto, salvo il normale deterioramento d'uso, pena il risarcimento del danno.\n\nArt. 14 - MODIFICHE CONTRATTUALI\nQualsiasi modifica al presente contratto non può avere luogo e non può essere provata se non mediante atto scritto.\n\nArt. 15 - DOMICILIO E COMUNICAZIONI\nAi fini del presente contratto, le parti eleggono domicilio:\n- il LOCATORE in [CITTÀ], [INDIRIZZO];\n- il CONDUTTORE in [CITTÀ], [INDIRIZZO IMMOBILE], int. [N].\n\nTutte le comunicazioni riguardanti il presente contratto dovranno essere effettuate tramite PEC ai seguenti indirizzi:\n- LOCATORE: [inserire PEC]\n- CONDUTTORE: [inserire PEC]\n\nArt. 16 - REGISTRAZIONE\nIl presente contratto sarà registrato a cura del LOCATORE. Le spese di registrazione saranno a carico del LOCATORE.\n\nArt. 17 - RINVIO\nPer quanto non espressamente previsto dal presente contratto, le parti fanno espresso rinvio alle disposizioni degli articoli 1571 e seguenti del Codice Civile, alla Legge n. 431/98, e comunque alle norme vigenti e agli usi locali.\n\nArt. 18 - FORO COMPETENTE\nPer qualsiasi controversia derivante dal presente contratto è competente in via esclusiva il Foro di Milano.\n\nArt. 19 - TRATTAMENTO DEI DATI PERSONALI\nIl LOCATORE e il CONDUTTORE si autorizzano reciprocamente al trattamento dei dati personali in conformità al Regolamento UE 2016/679 (GDPR) e al D.Lgs. 196/2003 e successive modifiche, dichiarando di aver ricevuto l'informativa prevista dalla normativa vigente.\n\nLetto, approvato e sottoscritto.\n\nMilano, _________________\n\nIL LOCATORE                                                IL CONDUTTORE\n_________________                                     _________________\n\nAi sensi e per gli effetti degli articoli 1341 e 1342 del Codice Civile, il CONDUTTORE dichiara di approvare specificamente le clausole di cui agli articoli: 3 (Durata della locazione), 4 (Recesso anticipato del conduttore), 5 (Canone di locazione), 6 (Deposito cauzionale e mensilità anticipate), 8 (Obblighi del conduttore), 11 (Divieti), 12 (Clausola risolutiva espressa), 18 (Foro competente).\n\nIL CONDUTTORE\n_________________\n\nALLEGATI:\nA) Inventario dei mobili e arredi\nB) Attestato di Prestazione Energetica (APE)\nC) Documentazione attestante l'iscrizione universitaria",
  "output_url": "https://tinyurl.com/4yfswxf2",
  "categoria_en": "Legal",
  "capitolo_en": "Chapter 5",
  "scopo_en": "Lease agreement wizard",
  "descrizione_en": "Guided interview to draft a residential lease agreement (Italian law).",
  "testo_en": "[SYSTEM] You are an Italian lawyer specializing in real estate law, with expertise in drafting lease agreements that comply with Italian legislation (Law 431/98 and subsequent amendments). Your mission is to guide the user through an interactive data-gathering process to create a fully customized and legally valid lease agreement.\n\n[CONTEXT] The user needs to draft a lease agreement for a property in Italy but has not provided detailed information. You will conduct a structured interview to gather all the necessary data, explaining the legal relevance of each piece of information and the options available under Italian law.\n\n[BEHAVIOR] Take a teaching-oriented but professional approach.\nFor each category of information:\n1. Briefly explain why this information is legally relevant\n2. Present the available options with their advantages and disadvantages\n3. Record the user's decision\n4. Confirm the choice before moving on to the next section\n\n[INSTRUCTIONS] Conduct a complete interview organized into the following sections, progressively gathering all the information needed for a valid and effective lease agreement:\n\n**SECTION 1: TYPE OF AGREEMENT**\nPresent and explain the different types of agreement available under Italian law:\n- Open-market rent agreement (4+4 years)\n- Agreed-rent agreement (3+2 years)\n- Short-term (transitional) agreement\n- University student agreement\n\nFor each type, explain:\n- Main features\n- Duration and renewal\n- Tax benefits\n- Specific requirements\n- Particular constraints\n- When it is advisable\n\n**SECTION 2: DETAILS OF THE PARTIES**\nGather information on:\n\nFOR THE LANDLORD:\n- Is the landlord an individual or a legal entity?\n- Name/Company name\n- Tax code/VAT number\n- Residence/Registered office\n- Details of any representative\n\nFOR THE TENANTS:\n- How many tenants will be named in the agreement?\n- For each tenant: name, tax code, current residence\n- Are the tenants related to each other?\n- Are they students, workers or other?\n- For students: university attended and degree program\n\n**SECTION 3: DESCRIPTION OF THE PROPERTY**\n- Location (full address)\n- Land registry data (sheet, parcel, sub-unit, category)\n- Floor area (in square meters)\n- Layout (number and type of rooms)\n- State of repair\n- Furnishings (furnished, semi-furnished or unfurnished)\n- Available certificates (energy performance certificate, system compliance)\n- Energy class\n- Appurtenances (cellar, garage, parking space)\n\n**SECTION 4: FINANCIAL TERMS**\n- Monthly rent amount\n- Payment methods\n- Monthly payment due date\n- ISTAT (cost-of-living) adjustment\n- Security deposit amount\n- Any rent paid in advance\n- Handling of condominium fees\n- Allocation of utilities\n- Ancillary charges and how they are handled\n\n**SECTION 5: DURATION AND TIMING**\n- Lease start date\n- Expected duration (based on the type of agreement chosen)\n- Renewal conditions\n- Early termination options\n- Notice periods\n- Special conditions linked to temporary needs (e.g. study, work)\n\n**SECTION 6: OBLIGATIONS AND RESPONSIBILITIES**\n- Permitted use of the property\n- Responsibility for routine maintenance\n- Responsibility for extraordinary maintenance\n- Alterations and improvements to the property\n- Subletting and guests\n- Pets\n- Applicable condominium rules\n\n**SECTION 7: SPECIAL CONDITIONS**\n- Specific clauses requested by the landlord\n- Specific clauses requested by the tenant\n- Handling of particular situations (e.g. out-of-town students, Erasmus)\n- Any agreements on specific furnishings or services\n\n**SECTION 8: FORMALITIES AND REQUIREMENTS**\n- Registration of the agreement\n- Method for formal communications\n- Dispute resolution\n- Competent court\n- Specific legal references to include\n\nOnce the data gathering is complete, summarize all the information collected and offer the option to change any detail before proceeding with the final draft of the agreement.",
  "output_en": "Note: all the data shown are entirely fictitious and are for demonstration purposes only. This is a courtesy translation of a contract governed by Italian law.\n\nRESIDENTIAL LEASE AGREEMENT\nFOR UNIVERSITY STUDENTS\n(pursuant to Article 5, paragraph 2, of Law No. 431 of December 9, 1998)\n\nBETWEEN\n\nMr. [LANDLORD NAME], born in [date of birth to be entered], Tax Code [TAX CODE], residing in [CITY] at [ADDRESS], e-mail: [EMAIL], telephone: [TELEPHONE], hereinafter referred to as the \"LANDLORD\"\n\nAND\n\nMr. [TENANT NAME], born in [date of birth to be entered], Tax Code [TAX CODE], residing in [CITY] at [ADDRESS], a student enrolled at the Politecnico di Milano, hereinafter referred to as the \"TENANT\"\n\nTHE PARTIES AGREE AS FOLLOWS\n\nArt. 1 - SUBJECT OF THE LEASE\nThe LANDLORD leases to the TENANT, who accepts, the residential unit located in [CITY], [PROPERTY ADDRESS], unit [N], consisting of 3 separate bedrooms, 3 bathrooms and a common living room, with a total floor area of approximately 100 square meters.\n\nThe property is registered in the Building Land Registry of the Municipality of Milan as follows:\n- Urban section N\n- Sheet 35\n- Sub-unit 8\n- Land registry category A/2 (standard residential dwelling)\n- Class 3\n- Rooms 5\n- Floor area 100 sq m\n- Assessed cadastral income EUR 1,200.00\n\nThe property has recently been renovated and is leased fully furnished, as per the inventory attached to this agreement (Annex A).\n\nThe property's systems comply with the law and it is rated Energy Class E, as shown in the Energy Performance Certificate, a copy of which is attached to this agreement (Annex B).\n\nArt. 2 - PERMITTED USE\nThe property shall be used exclusively as a private residence for the TENANT and the persons living with him. The TENANT declares that he is an out-of-town university student enrolled at the Politecnico di Milano, as shown in the attached documentation (Annex C). Any change of use not authorized by the LANDLORD shall result in the automatic termination (ipso jure) of the agreement.\n\nArt. 3 - TERM OF THE LEASE\nThe lease shall have a term of 1 (one) year, starting on September 1, 2025 and ending on August 31, 2026.\n\nThe agreement shall renew automatically for a period of equal length, unless notice of non-renewal is given by registered letter with return receipt or certified e-mail (PEC) sent at least 3 (three) months before the expiration date.\n\nArt. 4 - EARLY TERMINATION BY THE TENANT\nThe TENANT may terminate the agreement early for serious reasons, by notifying the LANDLORD at least 3 (three) months in advance by registered letter with return receipt or certified e-mail (PEC).\n\nSerious reasons include: transfer to another university, discontinuation of studies, health reasons, internships or study periods abroad lasting more than 3 (three) months.\n\nArt. 5 - RENT\nThe rent is set at EUR 2,000.00 (two thousand/00) per month, which the TENANT undertakes to pay to the LANDLORD in equal monthly installments in advance by the first day of each month, by bank transfer to the account held by the LANDLORD at [enter bank details].\n\nThe rent shall be adjusted annually by 75% of the change in the ISTAT consumer price index for blue- and white-collar households recorded in the previous year.\n\nArt. 6 - SECURITY DEPOSIT AND RENT PAID IN ADVANCE\nAs security for the obligations undertaken under this agreement, the TENANT pays the LANDLORD the sum of EUR 6,000.00 (six thousand/00), equal to 3 (three) months' rent, as a security deposit that may not be applied toward rent.\n\nThe security deposit shall be returned at the end of the lease, after inspection of the condition of the property and verification that all contractual obligations have been fulfilled, within 30 days of the property being vacated.\n\nIn addition, upon signing this agreement, the TENANT pays the LANDLORD the sum of EUR 6,000.00 (six thousand/00), equal to 3 (three) months' rent in advance, which shall be applied to the rent for the first three months of the lease.\n\nArt. 7 - ANCILLARY CHARGES\nCondominium fees shall be borne by the LANDLORD.\n\nAll utilities (water, electricity, gas, heating, telephone, internet) and the costs of the waste collection service shall be borne by the TENANT.\n\nThe TENANT shall notify the LANDLORD that the utilities have been activated in his name within 15 days of delivery of the property.\n\nArt. 8 - OBLIGATIONS OF THE TENANT\nThe TENANT undertakes to:\na) Use the property with the diligence of a prudent person and for the use specified in the agreement;\nb) Carry out minor routine maintenance at his own expense;\nc) Not sublet or assign the property, even in part;\nd) Not make any alteration, addition or improvement to the property without the LANDLORD's prior written consent;\ne) Allow the LANDLORD to access the property, by appointment, to check its state of repair;\nf) Comply with the condominium rules, which he declares he is familiar with.\n\nArt. 9 - OBLIGATIONS OF THE LANDLORD\nThe LANDLORD undertakes to:\na) Deliver the property in a good state of repair;\nb) Guarantee the peaceful enjoyment of the property during the lease;\nc) Carry out extraordinary maintenance repairs;\nd) Pay the condominium fees.\n\nArt. 10 - MAINTENANCE AND REPAIRS\nRoutine maintenance shall be borne by the TENANT, while extraordinary maintenance shall be borne by the LANDLORD, pursuant to Articles 1576 and 1609 of the Italian Civil Code.\n\nThe TENANT shall promptly notify the LANDLORD, by certified e-mail (PEC), of any problems or need for extraordinary maintenance work.\n\nArt. 11 - PROHIBITIONS\nThe TENANT is prohibited from:\na) Subletting or assigning to third parties, in whole or in part, the leased property;\nb) Keeping pets;\nc) Carrying out activities in the property that are contrary to public order or public decency;\nd) Altering the internal layout of the rooms without the LANDLORD's prior written consent.\n\nArt. 12 - EXPRESS TERMINATION CLAUSE\nThis agreement shall be terminated by operation of law, pursuant to Article 1456 of the Italian Civil Code, in the event of:\na) Failure to pay, even partially, two months' rent;\nb) Unauthorized subletting or assignment of the agreement;\nc) A change in the use of the property;\nd) Serious or repeated breaches of contractual obligations.\n\nArt. 13 - RETURN OF THE PROPERTY\nAt the end of the lease, the TENANT undertakes to return the property to the LANDLORD in the same condition in which he received it, except for normal wear and tear, failing which he shall be liable for damages.\n\nArt. 14 - AMENDMENTS TO THE AGREEMENT\nNo amendment to this agreement may be made or proven except in writing.\n\nArt. 15 - ADDRESS FOR SERVICE AND NOTICES\nFor the purposes of this agreement, the parties elect the following addresses for service:\n- the LANDLORD at [CITY], [ADDRESS];\n- the TENANT at [CITY], [PROPERTY ADDRESS], unit [N].\n\nAll notices relating to this agreement shall be sent by certified e-mail (PEC) to the following addresses:\n- LANDLORD: [enter PEC address]\n- TENANT: [enter PEC address]\n\nArt. 16 - REGISTRATION\nThis agreement shall be registered by the LANDLORD. The registration costs shall be borne by the LANDLORD.\n\nArt. 17 - REFERENCE TO THE LAW\nFor anything not expressly provided for in this agreement, the parties expressly refer to the provisions of Articles 1571 et seq. of the Italian Civil Code, to Law No. 431/98, and in any case to the regulations in force and local custom.\n\nArt. 18 - COMPETENT COURT\nThe Court of Milan shall have exclusive jurisdiction over any dispute arising from this agreement.\n\nArt. 19 - PROCESSING OF PERSONAL DATA\nThe LANDLORD and the TENANT mutually authorize each other to process personal data in accordance with EU Regulation 2016/679 (GDPR) and Legislative Decree 196/2003 as amended, and declare that they have received the privacy notice required by the regulations in force.\n\nRead, approved and signed.\n\nMilan, _________________\n\nTHE LANDLORD                                                THE TENANT\n_________________                                     _________________\n\nPursuant to and for the purposes of Articles 1341 and 1342 of the Italian Civil Code, the TENANT declares that he specifically approves the clauses in the following articles: 3 (Term of the lease), 4 (Early termination by the tenant), 5 (Rent), 6 (Security deposit and rent paid in advance), 8 (Obligations of the tenant), 11 (Prohibitions), 12 (Express termination clause), 18 (Competent court).\n\nTHE TENANT\n_________________\n\nANNEXES:\nA) Inventory of furniture and furnishings\nB) Energy Performance Certificate (APE)\nC) Documentation proving university enrollment"
 },

  "testo": "Agisci come esperto di comunicazione executive e facilitatore di riunioni aziendali (town hall).\n\nContesto: devo presentare a tutto il mio gruppo i risultati di [ANNO] in termini economici, finanziari e di avanzamento rispetto al piano strategico di [SETTORE/AZIENDA]. Voglio evidenziare successi, insuccessi e lezioni imparate, e presentare gli obiettivi per [ANNO+1].\n\nPartecipanti: [numero e composizione, es. ~50 persone tra manager e team], riunione in modalità ibrida.\n\nModalità di lavoro: procedi uno step alla volta e fermati dopo ciascuno in attesa della mia conferma prima di passare al successivo.\n\nStep 1 (struttura dei tempi): aiutami a definire la durata dei singoli interventi rispettando questi vincoli:\n• durata totale 1 ora;\n• primi 10 minuti: benvenuto del CEO [NOME CEO];\n• almeno 3 slot da circa 5 minuti per la presentazione di 3 progetti di successo da parte di 3 colleghi ([PROGETTI]);\n• ultimi 15 minuti: domande e risposte.\n\nStep 2 (agenda dettagliata): proponimi l’agenda come tabella con le colonne intervento | relatore | minuti (max) | obiettivo del segmento. La somma dei minuti deve rispettare l’ora totale.\n\nStep 3 (validazione): chiedimi se concordo con l’agenda o se voglio modifiche, e applica le mie eventuali correzioni.\n\nStep 4 (contenuti slide per slide): a agenda confermata, per ogni intervento indicami quali slide preparare e quale contenuto inserire in ciascuna, in modo chiaro e sintetico. Per ogni slide aggiungi una checklist visiva essenziale (layout, gerarchia delle informazioni, uso dei colori, scelta dei font, elementi grafici come grafici, icone, immagini) con un esempio pratico.\n\nOutput: linguaggio chiaro e professionale, orientato a un pubblico aziendale.",

  "testo_en": "Act as an expert in executive communication and a facilitator of company meetings (town halls).\n\nContext: I need to present to my whole group the results for [YEAR] in terms of economic and financial performance and progress against the strategic plan of [INDUSTRY/COMPANY]. I want to highlight successes, failures and lessons learned, and present the objectives for [YEAR+1].\n\nParticipants: [number and composition, e.g. ~50 people including managers and teams], hybrid meeting.\n\nWay of working: proceed one step at a time and stop after each one, waiting for my confirmation before moving on to the next.\n\nStep 1 (timing structure): help me define the length of each segment within these constraints:\n• total duration 1 hour;\n• first 10 minutes: welcome from the CEO [CEO NAME];\n• at least 3 slots of about 5 minutes each for 3 colleagues to present 3 successful projects ([PROJECTS]);\n• last 15 minutes: questions and answers.\n\nStep 2 (detailed agenda): propose the agenda as a table with the columns segment | speaker | minutes (max) | objective of the segment. The minutes must add up to the one-hour total.\n\nStep 3 (validation): ask me whether I agree with the agenda or want changes, and apply any corrections I make.\n\nStep 4 (slide-by-slide content): once the agenda is confirmed, for each segment tell me which slides to prepare and what content to put in each one, clearly and concisely. For each slide, add an essential visual checklist (layout, information hierarchy, use of color, choice of fonts, graphic elements such as charts, icons, images) with a practical example.\n\nOutput: clear, professional language aimed at a business audience.",

  "testo": "Agisci come un esperto di comunicazione per mezzo di slide ed esegui una revisione completa della mia presentazione.\n\nIn particolare, desidero che venga effettuata un'analisi approfondita su quattro aspetti fondamentali:\n\nCorrettezza Grammaticale:\nSi prega di verificare l'intero testo della presentazione, individuando eventuali errori grammaticali, sintattici e ortografici, e suggerendo le opportune correzioni per garantire un uso impeccabile della lingua italiana.\n\nAccuratezza delle Informazioni:\nControllare la coerenza e la correttezza delle informazioni riportate, con particolare attenzione ai dati economici, finanziari e agli indicatori relativi al progresso strategico. Verificare che i numeri e le affermazioni siano coerenti e supportati da logica e fatti concreti. Chiedimi conferma qualora avessi dei dubbi.\n\nEfficacia della Comunicazione:\nFornire consigli dettagliati per migliorare la chiarezza e l'impatto comunicativo della presentazione. Suggerire eventuali modifiche nel linguaggio, nella struttura e nell'organizzazione dei contenuti, al fine di rendere il messaggio più diretto e coinvolgente per l'intero team.\n\nQualità Grafica e Visuale:\nOffrire indicazioni su come ottimizzare l'aspetto grafico delle slide. Questo include suggerimenti sul layout, l'uso appropriato dei colori, la scelta dei font, l'inserimento di elementi visivi (grafici, icone, immagini) e qualsiasi altra modifica che possa contribuire a una presentazione più professionale e accattivante.\n\nPer ciascuna delle sezioni sopra indicate, includi esempi pratici e suggerimenti specifici, in modo da poter implementare le eventuali modifiche con efficacia.",

  "categoria": "Apprendimento",

  "scopo": "Piano di upskilling rapido",
  "descrizione": "Valuta le competenze e costruisce un piano formativo per un nuovo ruolo.",
  "slug": "piano-upskilling-rapido",
  "tinyurl": "https://tinyurl.com/4w6yv94e",
  "testo": "Sulla base del mio profilo professionale (allegato come PDF del mio profilo LinkedIn o CV), aiutami a sviluppare un programma di formazione mirato sulla cybersecurity che mi permetta di interagire efficacemente con i CISO e promuovere servizi di cybersecurity. Ho bisogno di crearmi le competenze in questo settore per il nuovo incarico di CEO di una piccola società specializzata nella consulenza in ambito cybersecurity.\n\nModalità di lavoro: procedi per fasi e fermati dopo l’analisi del profilo e dopo l’autovalutazione, in attesa della mia conferma, prima di generare il piano di formazione.\n\nFase 1 (analisi del profilo e valutazione delle competenze)\nInnanzitutto, analizza il mio background professionale per:\n1. Identificare la mia esperienza rilevante nel campo della cybersecurity\n2. Valutare il mio attuale livello di conoscenza in cybersecurity basandoti sulla mia storia professionale\n3. Individuare le mie competenze trasferibili dai ruoli di certificazione, compliance e leadership\n4. Determinare le lacune di conoscenza che necessitano di essere colmate\n\nFase 2 (autovalutazione guidata)\nNon assegnare tu i punteggi al posto mio: proponimi una griglia di autovalutazione (scala da 1 a 5) sui domini chiave elencati sotto e chiedimi di compilarla. Userai le mie risposte, non le tue stime, per calibrare il piano sui gap reali.\n\nCompetenze Tecniche:\n• Framework e metodologie di Governance, Risk & Compliance\n• Approcci e strumenti di Cyber Risk Quantification\n• Concetti e metodologie di Offensive Security\n• Principi di Identity and Access Management\n• Funzioni e processi del Security Operations Center\n• Protocolli e best practice di Incident Response\n• Approcci di integrazione DevSecOps\n• Considerazioni sulla sicurezza IoT/OT per ambienti industriali\n\nCompetenze Strategiche/di Business:\n• Allineamento delle iniziative di sicurezza con gli obiettivi aziendali\n• Comunicazione dei rischi cyber ai dirigenti esecutivi\n• Comprensione dei requisiti normativi (GDPR, NIS2, DORA, ecc.)\n• Cyber insurance e meccanismi di trasferimento del rischio\n• Analisi del mercato della cybersecurity e tendenze\n• Metodologie di valutazione del ROI degli investimenti in sicurezza\n\nConoscenza del Mercato:\n• Principali vendor e fornitori di soluzioni di sicurezza\n• Tecnologie e approcci emergenti nella cybersecurity\n• Comprensione dell’attuale panorama delle minacce\n• Priorità dei CISO e processi decisionali\n\nFase 3 (sviluppo del programma di formazione)\nSulla base della mia autovalutazione, crea un piano di formazione completo di 30 giorni (2 ore al giorno) che:\n• Elevi le mie competenze tecniche nei domini della cybersecurity\n• Approfondisca la mia comprensione del mercato della cybersecurity, dei player chiave e delle soluzioni\n• Migliori la mia capacità di interagire efficacemente con i CISO comprendendo le loro sfide\n• Rafforzi le mie capacità di tradurre le esigenze di sicurezza in proposte di valore aziendale\n• Sviluppi capacità di vendita consulenziale per servizi di cybersecurity\n\nObiettivo di livello: il piano deve prepararmi a dialoghi credibili con i CISO, sia sul piano tecnico sia su quello di business, senza sovrastimare la profondità tecnica raggiungibile in 30 giorni. Deve costruire fluidità conversazionale e credibilità, restando trasparente sui limiti di competenza da colmare nel tempo.\n\nIl piano deve includere:\n• Una roadmap di apprendimento strutturata organizzata per temi settimanali\n• Risorse di apprendimento giornaliere indicate per tipologia (libri, corsi, articoli, podcast, webinar), con l’indicazione di come reperire quelle più aggiornate; segnala esplicitamente di verificare l’esistenza e l’attualità di ogni risorsa prima di usarla\n• Esercizi pratici per rafforzare le conoscenze teoriche\n• Opportunità di networking con esperti del settore\n• Metriche di misurazione dei progressi per la valutazione settimanale\n• Scenari di role-playing che simulano conversazioni con CISO\n\nFase 4 (strategia di coinvolgimento dei CISO)\nCome parte del piano, aiutami a sviluppare:\n• Un framework per comprendere le priorità dei CISO in diversi settori industriali\n• Una guida alla conversazione con domande strategiche per scoprire esigenze e sfide\n• Modelli di proposta di valore per posizionare soluzioni di cybersecurity\n• Risposte alle obiezioni e preoccupazioni comuni\n• Un glossario essenziale di terminologia tecnica e di business\n\nFase 5 (intelligence continua sul mercato)\nInfine, consiglia risorse per rimanere aggiornato, indicandone la tipologia e ricordandomi di verificarne l’attualità:\n• Fonti chiave di informazione (blog, newsletter, pubblicazioni specializzate)\n• Eventi e conferenze di settore rilevanti\n• Comunità professionali e forum di discussione\n• Report di analisti di mercato da seguire\n• Metodi per monitorare minacce emergenti e soluzioni innovative\n\nIl mio obiettivo finale è sfruttare la mia attuale esperienza dirigenziale combinandola con una conoscenza più approfondita della cybersecurity per promuovere efficacemente i servizi di cybersecurity attraverso conversazioni significative con i responsabili della sicurezza. Il piano dovrebbe basarsi sui miei punti di forza attuali affrontando le lacune che mi impedirebbero di interagire con sicurezza con i CISO sia a livello tecnico che aziendale.",

  "descrizione_en": "Assesses your skills and builds a training plan for a new role.",
  "testo_en": "Based on my professional profile (attached as a PDF of my LinkedIn profile or CV), help me develop a targeted cybersecurity training program that will enable me to engage effectively with CISOs and promote cybersecurity services. I need to build my skills in this field for my new appointment as CEO of a small company specializing in cybersecurity consulting.\n\nWay of working: proceed in phases and stop after the profile analysis and after the self-assessment, waiting for my confirmation, before generating the training plan.\n\nPhase 1 (profile analysis and skills assessment)\nFirst, analyze my professional background to:\n1. Identify my relevant experience in the field of cybersecurity\n2. Assess my current level of cybersecurity knowledge based on my career history\n3. Identify my transferable skills from certification, compliance and leadership roles\n4. Determine the knowledge gaps that need to be filled\n\nPhase 2 (guided self-assessment)\nDo not assign the scores on my behalf: give me a self-assessment grid (scale of 1 to 5) for the key domains listed below and ask me to fill it in. You will use my answers, not your own estimates, to calibrate the plan to my real gaps.\n\nTechnical Skills:\n• Governance, Risk & Compliance frameworks and methodologies\n• Cyber Risk Quantification approaches and tools\n• Offensive Security concepts and methodologies\n• Identity and Access Management principles\n• Security Operations Center functions and processes\n• Incident Response protocols and best practices\n• DevSecOps integration approaches\n• IoT/OT security considerations for industrial environments\n\nStrategic/Business Skills:\n• Aligning security initiatives with business objectives\n• Communicating cyber risk to senior executives\n• Understanding regulatory requirements (GDPR, NIS2, DORA, etc.)\n• Cyber insurance and risk transfer mechanisms\n• Cybersecurity market analysis and trends\n• Methodologies for assessing the ROI of security investments\n\nMarket Knowledge:\n• Main security vendors and solution providers\n• Emerging technologies and approaches in cybersecurity\n• Understanding of the current threat landscape\n• CISO priorities and decision-making processes\n\nPhase 3 (developing the training program)\nBased on my self-assessment, create a complete 30-day training plan (2 hours a day) that:\n• Raises my technical skills across the cybersecurity domains\n• Deepens my understanding of the cybersecurity market, its key players and solutions\n• Improves my ability to engage effectively with CISOs by understanding their challenges\n• Strengthens my ability to translate security needs into business value propositions\n• Develops consultative selling skills for cybersecurity services\n\nTarget level: the plan must prepare me for credible conversations with CISOs, on both technical and business topics, without overestimating the technical depth that can be reached in 30 days. It must build conversational fluency and credibility, while being transparent about the skill gaps still to be filled over time.\n\nThe plan must include:\n• A structured learning roadmap organized by weekly themes\n• Daily learning resources indicated by type (books, courses, articles, podcasts, webinars), with guidance on how to find the most up-to-date ones; explicitly remind me to check that each resource exists and is current before using it\n• Practical exercises to reinforce theoretical knowledge\n• Networking opportunities with industry experts\n• Progress metrics for a weekly review\n• Role-playing scenarios that simulate conversations with CISOs\n\nPhase 4 (CISO engagement strategy)\nAs part of the plan, help me develop:\n• A framework for understanding CISO priorities across different industries\n• A conversation guide with strategic questions to uncover needs and challenges\n• Value proposition templates for positioning cybersecurity solutions\n• Responses to common objections and concerns\n• An essential glossary of technical and business terminology\n\nPhase 5 (ongoing market intelligence)\nFinally, recommend resources to stay up to date, indicating their type and reminding me to check that they are current:\n• Key sources of information (blogs, newsletters, specialist publications)\n• Relevant industry events and conferences\n• Professional communities and discussion forums\n• Market analyst reports to follow\n• Methods for monitoring emerging threats and innovative solutions\n\nMy ultimate goal is to leverage my current executive experience, combined with a deeper knowledge of cybersecurity, to promote cybersecurity services effectively through meaningful conversations with security leaders. The plan should build on my current strengths while addressing the gaps that would prevent me from engaging confidently with CISOs at both a technical and a business level.",

 },

  "testo": "Esegui un’analisi approfondita del mercato del lavoro all’intersezione tra [Cybersecurity] e [Intelligenza Artificiale], utilizzando il mio profilo professionale allegato per la contestualizzazione.\n\nRequisiti di affidabilità: usa un modello con accesso a fonti aggiornate (navigazione o strumenti). Per ogni dato quantitativo cita la fonte e la data di rilevazione, e distingui i dati verificati dalle stime indicando un livello di confidenza. Non presentare numeri non verificabili come certi.\n\nPrima di iniziare, chiedimi conferma su: area geografica di interesse ([PAESE/I], default Europa), orizzonte temporale dell’analisi e livello di seniority target ([LIVELLO DI SENIORITY]).\n\n1. ANALISI QUANTITATIVA\n• Identifica i 10 ruoli emergenti con maggiore crescita percentuale negli ultimi 12 mesi\n• Analizza la distribuzione geografica delle opportunità nell’area indicata\n• Determina i range salariali per ciascun ruolo, con breakdown per Paese e fascia di seniority (non una media unica)\n• Calcola il gap tra domanda e offerta per questi ruoli\n\n2. ANALISI QUALITATIVA\n• Estrai i cluster di competenze richieste per ciascun ruolo\n• Identifica pattern comuni nelle \"preferred qualifications\"\n• Analizza l’evoluzione delle job description negli ultimi 24 mesi\n• Valuta l’impatto dell’EU AI Act e di altre normative sulla domanda di competenze, riferendoti allo stato di attuazione alla data di rilevazione\n\n3. MAPPATURA DELLE OPPORTUNITÀ\n• Individua nicchie di mercato con alta domanda e bassa concorrenza\n• Identifica i ruoli dove la mia esperienza in [Cybersecurity] rappresenta un vantaggio differenziale\n• Suggerisci 3-5 ruoli specifici dove potrei posizionarmi strategicamente\n\n4. VALUTAZIONE COMPETITIVA\n• Analizza il profilo tipico dei candidati per i ruoli suggeriti\n• Identifica i punti di differenziazione rispetto al mio profilo\n• Suggerisci strategie per colmare eventuali gap\n\nPresenta i risultati in formato strutturato, con tabelle chiare e una colonna \"fonte / livello di confidenza\" per i dati quantitativi. Se l’ambiente lo consente, proponi anche grafici; altrimenti fornisci i dati in tabella pronti per essere visualizzati.",

  "testo_en": "Carry out an in-depth analysis of the job market at the intersection of [Cybersecurity] and [Artificial Intelligence], using my attached professional profile for context.\n\nReliability requirements: use a model with access to up-to-date sources (browsing or tools). For every quantitative figure, cite the source and the date it was collected, and distinguish verified data from estimates by indicating a confidence level. Do not present unverifiable numbers as certain.\n\nBefore you start, ask me to confirm: the geographic area of interest ([COUNTRY/COUNTRIES], default Europe), the time horizon of the analysis and the target seniority level ([SENIORITY LEVEL]).\n\n1. QUANTITATIVE ANALYSIS\n• Identify the 10 emerging roles with the highest percentage growth in the last 12 months\n• Analyze the geographic distribution of opportunities in the specified area\n• Determine the salary ranges for each role, broken down by country and seniority band (not a single average)\n• Calculate the gap between supply and demand for these roles\n\n2. QUALITATIVE ANALYSIS\n• Extract the clusters of skills required for each role\n• Identify common patterns in the \"preferred qualifications\"\n• Analyze how job descriptions have evolved over the last 24 months\n• Assess the impact of the EU AI Act and other regulations on skills demand, referring to their implementation status at the date of the analysis\n\n3. OPPORTUNITY MAPPING\n• Identify market niches with high demand and low competition\n• Identify the roles where my experience in [Cybersecurity] is a differentiating advantage\n• Suggest 3-5 specific roles where I could position myself strategically\n\n4. COMPETITIVE ASSESSMENT\n• Analyze the typical candidate profile for the suggested roles\n• Identify the points of differentiation compared with my profile\n• Suggest strategies to close any gaps\n\nPresent the results in a structured format, with clear tables and a \"source / confidence level\" column for the quantitative data. If the environment allows it, also propose charts; otherwise, provide the data in tables ready to be visualized.",

  "tinyurl": "https://tinyurl.com/4u36z89k",
  "testo": "Conduci una ricerca approfondita su [nome azienda] per prepararmi al colloquio per la posizione di [AI Security Integration Manager].\n\nRequisiti di affidabilità: usa un modello con accesso a fonti aggiornate (navigazione o strumenti). Cita le fonti con la data di rilevazione e distingui i dati verificati dalle inferenze; non presentare come certo ciò che non è verificabile. Per le persone, usa esclusivamente informazioni professionali pubbliche, senza illazioni né dati personali sensibili.\n\n1. PROFILO AZIENDALE\n• Storia ed evoluzione dell’azienda con focus sulle iniziative digitali e AI\n• Analisi del modello di business e proposizione di valore\n• Posizionamento competitivo e differenziatori strategici\n• Cultura aziendale e valori (analizzando Glassdoor, social media, interviste pubbliche)\n\n2. TRAIETTORIA STRATEGICA\n• Analisi degli ultimi 3 report annuali e comunicati stampa, con la data di ciascuna fonte\n• Investimenti recenti in tecnologia e AI\n• Acquisizioni strategiche negli ultimi 24 mesi rispetto alla data di rilevazione\n• Collaborazioni e partnership rilevanti\n• Patent filing recenti che indicano direzioni tecnologiche\n\n3. SFIDE E OPPORTUNITÀ\n• Sfide specifiche del settore [infrastrutture critiche] rispetto all’AI\n• Trend normativi che impattano l’adozione dell’AI in questo settore, riferiti al loro stato di attuazione alla data di rilevazione\n• Iniziative di competitor diretti in ambito AI\n• Gap potenziali nella strategia di implementazione AI\n\n4. LEADERSHIP E DECISION MAKER\n• Background professionale dei principali executive (solo informazioni pubbliche)\n• Analisi delle dichiarazioni pubbliche su AI, innovazione e sicurezza\n• Interessi professionali e temi ricorrenti nei loro contributi LinkedIn\n• Identificazione di valori e priorità espresse pubblicamente\n\n5. DOMANDE STRATEGICHE PERSONALI\n• Genera 10 domande che potrei porre durante il colloquio che dimostrino:\n a) Comprensione approfondita del business\n b) Allineamento con le sfide strategiche\n c) Visione per il ruolo specifico\n d) Capacità di generare valore immediato\n\nPresenta l’analisi in formato strutturato, con una colonna o nota \"fonte / livello di confidenza\" per le informazioni fattuali, e con particolare enfasi sui punti che rappresentano opportunità di connessione tra la mia esperienza e le esigenze dell’azienda.",

  "categoria_en": "Career",

  "scopo_en": "Company intelligence",
  "descrizione_en": "Builds an in-depth company profile for interviews/business development.",
  "testo_en": "Carry out in-depth research on [company name] to prepare me for the interview for the position of [AI Security Integration Manager].\n\nReliability requirements: use a model with access to up-to-date sources (browsing or tools). Cite your sources with the date they were collected and distinguish verified data from inferences; do not present as certain anything that cannot be verified. For people, use only public professional information, with no speculation and no sensitive personal data.\n\n1. COMPANY PROFILE\n• History and evolution of the company, with a focus on digital and AI initiatives\n• Analysis of the business model and value proposition\n• Competitive positioning and strategic differentiators\n• Company culture and values (analyzing Glassdoor, social media, public interviews)\n\n2. STRATEGIC TRAJECTORY\n• Analysis of the last 3 annual reports and press releases, with the date of each source\n• Recent investments in technology and AI\n• Strategic acquisitions in the 24 months before the date of the research\n• Relevant collaborations and partnerships\n• Recent patent filings that point to technological directions\n\n3. CHALLENGES AND OPPORTUNITIES\n• Specific challenges of the [critical infrastructure] industry with regard to AI\n• Regulatory trends affecting AI adoption in this industry, referring to their implementation status at the date of the research\n• AI initiatives of direct competitors\n• Potential gaps in the AI implementation strategy\n\n4. LEADERSHIP AND DECISION-MAKERS\n• Professional background of the main executives (public information only)\n• Analysis of their public statements on AI, innovation and security\n• Professional interests and recurring themes in their LinkedIn contributions\n• Identification of publicly expressed values and priorities\n\n5. MY STRATEGIC QUESTIONS\n• Generate 10 questions I could ask during the interview that demonstrate:\n a) An in-depth understanding of the business\n b) Alignment with the strategic challenges\n c) A vision for the specific role\n d) The ability to generate immediate value\n\nPresent the analysis in a structured format, with a \"source / confidence level\" column or note for factual information, and with particular emphasis on the points that represent opportunities to connect my experience with the company's needs.",

  "id": "IA-27",

  "scopo": "Simulazione di colloquio + feedback",
  "descrizione": "Simula un colloquio realistico (voce) con feedback finale.",
  "slug": "simulazione-colloquio",
  "tinyurl": "https://tinyurl.com/2nuthtf2",
  "testo": "Voglio che tu simuli un colloquio realistico per una posizione di AI Security Governance Lead. Comportati come un panel di intervistatori composto da CISO, CTO e Head of AI.\n\nFASE 1: STRUTTURA DEL COLLOQUIO\nConduci un'intervista strutturata in tre parti:\n1. Background e motivazione (5-7 minuti)\n2. Domande tecniche sulla sicurezza AI (10-12 minuti)\n3. Domande situazionali e comportamentali (10 minuti)\nFASE 2: CARATTERISTICHE DELL'INTERVISTA\n- Fai una domanda alla volta e attendi la mia risposta\n- Approfondisci le risposte incomplete o vaghe\n- Includi domande impegnative che testino i limiti della mia conoscenza\n- Simula diversi stili di intervistatori (tecnico, scettico, collaborativo)\n- Inserisci occasionalmente interruzioni o cambi di argomento improvvisi\nFASE 3: AREE DI FOCUS SPECIFICHE\nConcentrati su queste aree chiave:\n- Implementazione di framework di sicurezza integrati\n- Valutazione dei rischi specifici dei sistemi AI\n- Compliance normativa (EU AI Act, NIST AI RMF)\n- Gestione di incidenti di sicurezza in sistemi AI\n- Leadership di team cross-funzionali\n- Visione futura dell'integrazione tra sicurezza tradizionale e AI\n\nFASE 4: FEEDBACK\nAl termine della simulazione, fornisci:\n- Analisi dettagliata delle mie risposte (punti di forza/aree di miglioramento)\n- Consigli specifici per migliorare la comunicazione delle mie competenze\n- Suggerimenti su come rispondere meglio alle domande più difficili",
  "output": "",
  "output_url": "",
  "categoria_en": "Career",
  "capitolo_en": "Chapter 7",
  "scopo_en": "Mock interview + feedback",
  "descrizione_en": "Simulates a realistic (voice) interview with final feedback.",
  "testo_en": "I want you to simulate a realistic interview for an AI Security Governance Lead position. Act as an interview panel made up of a CISO, a CTO and a Head of AI.\n\nPHASE 1: INTERVIEW STRUCTURE\nConduct a structured interview in three parts:\n1. Background and motivation (5-7 minutes)\n2. Technical questions on AI security (10-12 minutes)\n3. Situational and behavioral questions (10 minutes)\nPHASE 2: INTERVIEW CHARACTERISTICS\n- Ask one question at a time and wait for my answer\n- Probe incomplete or vague answers\n- Include challenging questions that test the limits of my knowledge\n- Simulate different interviewer styles (technical, skeptical, collaborative)\n- Occasionally include interruptions or sudden changes of topic\nPHASE 3: SPECIFIC FOCUS AREAS\nConcentrate on these key areas:\n- Implementing integrated security frameworks\n- Assessing the specific risks of AI systems\n- Regulatory compliance (EU AI Act, NIST AI RMF)\n- Managing security incidents in AI systems\n- Leading cross-functional teams\n- A future vision for the integration of traditional security and AI\n\nPHASE 4: FEEDBACK\nAt the end of the simulation, provide:\n- A detailed analysis of my answers (strengths/areas for improvement)\n- Specific advice on how to communicate my skills better\n- Suggestions on how to answer the most difficult questions more effectively",
  "output_en": ""

  "slug": "negoziazione-offerta",
  "tinyurl": "https://tinyurl.com/2cs5shhx",
  "testo": "Analizza la seguente offerta di lavoro per la posizione di [AI Security Integration Manager] e sviluppa una strategia di negoziazione completa.\n\nRequisiti di affidabilità: usa un modello con accesso a fonti aggiornate (navigazione o strumenti) per i benchmark retributivi. Cita le fonti con la data di rilevazione e distingui i dati verificati dalle stime; non presentare come certe cifre non verificabili. Nello script, fai riferimento solo a offerte o alternative reali, senza inventare leve competitive.\n\nDETTAGLI DELL’OFFERTA:\n• Salario base annuo: [€X]\n• Bonus target: [Y%]\n• Equity/Stock Options: [dettagli]\n• Benefits: [lista]\n• Altre componenti: [dettagli]\n\nLA MIA SITUAZIONE ATTUALE:\n• Ultima posizione: [ruolo]\n• Ultimo compenso: [dettagli]\n• Altre offerte/opportunità: [se applicabile]\n• Priorità personali: [lista]\n• Riferimento di mercato: [PAESE] e [LIVELLO DI SENIORITY] per calibrare i benchmark\n\n1. ANALISI COMPETITIVA\n• Confronta l’offerta con benchmark di mercato per ruoli simili, normalizzati per Paese e seniority\n• Valuta ciascuna componente separatamente (base, variabile, equity, benefits)\n• Identifica elementi sotto-benchmark o mancanti\n• Analizza la struttura complessiva in relazione al mercato alla data di rilevazione\n\n2. STRATEGIA DI NEGOZIAZIONE\n• Identifica i 3 elementi prioritari da negoziare\n• Suggerisci range target realistici per ciascun elemento\n• Proponi trade-off strategici tra diverse componenti\n• Sviluppa una strategia di negoziazione in fasi, con contingency plan\n\n3. SCRIPT NEGOZIALE\n• Crea un framework per la conversazione iniziale\n• Sviluppa risposte per possibili obiezioni\n• Suggerisci formulazioni specifiche per richieste chiave\n• Prepara closing statement per diverse situazioni\n\n4. CONSIDERAZIONI NON MONETARIE\n• Identifica elementi non monetari negoziabili di valore (remote work, formazione, flessibilità)\n• Suggerisci come integrare questi elementi nella negoziazione\n• Proponi come quantificare il valore di questi elementi\n\n5. PIANO D’AZIONE\n• Sequenza ottimale di comunicazioni\n• Timing strategico\n• Modalità di comunicazione consigliate\n• Segnali di apertura/chiusura da monitorare\n\nPresenta i risultati in formato strutturato, con una nota \"fonte / livello di confidenza\" per i dati di mercato, raccomandazioni specifiche e script per avviare la negoziazione.",

  "categoria_en": "Career",
  "capitolo_en": "Chapter 7",
  "scopo_en": "Negotiating the offer",
  "descrizione_en": "Analyzes the offer against benchmarks and prepares the strategy.",
  "testo_en": "Analyze the following job offer for the position of [AI Security Integration Manager] and develop a complete negotiation strategy.\n\nReliability requirements: use a model with access to up-to-date sources (browsing or tools) for salary benchmarks. Cite your sources with the date they were collected and distinguish verified data from estimates; do not present unverifiable figures as certain. In the script, refer only to real offers or alternatives, without inventing competitive leverage.\n\nDETAILS OF THE OFFER:\n• Annual base salary: [€X]\n• Target bonus: [Y%]\n• Equity/Stock options: [details]\n• Benefits: [list]\n• Other components: [details]\n\nMY CURRENT SITUATION:\n• Last position: [role]\n• Last compensation: [details]\n• Other offers/opportunities: [if applicable]\n• Personal priorities: [list]\n• Market reference: [COUNTRY] and [SENIORITY LEVEL] to calibrate the benchmarks\n\n1. COMPETITIVE ANALYSIS\n• Compare the offer with market benchmarks for similar roles, normalized by country and seniority\n• Assess each component separately (base, variable, equity, benefits)\n• Identify elements that are below benchmark or missing\n• Analyze the overall structure in relation to the market at the date of the research\n\n2. NEGOTIATION STRATEGY\n• Identify the 3 priority elements to negotiate\n• Suggest realistic target ranges for each element\n• Propose strategic trade-offs between the different components\n• Develop a phased negotiation strategy, with a contingency plan\n\n3. NEGOTIATION SCRIPT\n• Create a framework for the initial conversation\n• Develop responses to possible objections\n• Suggest specific wording for key requests\n• Prepare closing statements for different situations\n\n4. NON-MONETARY CONSIDERATIONS\n• Identify valuable non-monetary elements that can be negotiated (remote work, training, flexibility)\n• Suggest how to integrate these elements into the negotiation\n• Propose how to quantify the value of these elements\n\n5. ACTION PLAN\n• Optimal sequence of communications\n• Strategic timing\n• Recommended communication channels\n• Opening/closing signals to watch for\n\nPresent the results in a structured format, with a \"source / confidence level\" note for market data, specific recommendations and scripts to open the negotiation.",
  "output_en": ""
 },

  "testo": "Sviluppa una mappatura completa delle competenze necessarie per eccellere nel ruolo di [Executive VP Cybersecurity], considerando il mio background in [gestione IT e certificazione].\n\n1. COMPETENZE TECNICHE FONDAMENTALI\n   - Identifica i 15-20 domini tecnici essenziali per questo ruolo\n   - Per ciascun dominio, specifica:\n\t* Concetti fondamentali da padroneggiare\n\t* Terminologia specialistica da acquisire\n\t* Metodologie e framework di riferimento\n\t* Livello di profondità richiesto (overview/operativo/esperto)\n\n2. COMPETENZE STRATEGICHE E MANAGERIALI\n   - Identifica 10-12 competenze chiave di leadership nel contesto specifico\n   - Per ciascuna competenza, delinea:\n\t* Applicazioni pratiche nel ruolo\n\t* Framework decisionali rilevanti\n\t* Metriche di valutazione dell'efficacia\n\t* Best practices nel settore specifico\n\n3. TREND EMERGENTI E INNOVAZIONI\n   - Identifica 5-7 sviluppi emergenti con potenziale impatto sul ruolo\n   - Per ciascun trend, specifica:\n\t* Impatto previsto a breve/medio termine\n\t* Implicazioni per la strategia aziendale\n\t* Principali attori e stakeholder coinvolti\n\t* Risorse per rimanere aggiornati\n\n4. REGOLAMENTAZIONE E COMPLIANCE\n   - Identifica framework normativi e standard di settore rilevanti\n   - Per ciascuno, delinea:\n\t* Requisiti fondamentali da comprendere\n\t* Implicazioni operative dirette\n\t* Timeline di implementazione/scadenze\n\t* Risorse autorevoli per l'approfondimento\n\n5. CASI DI STUDIO E BEST PRACTICES\n   - Identifica 8-10 casi emblematici nel settore\n   - Per ciascun caso, evidenzia:\n\t* Contesto e sfide affrontate\n\t* Approcci adottati e risultati ottenuti\n\t* Lezioni chiave applicabili al mio contesto\n\t* Fonti per approfondimento dettagliato\n\nAssicurati che la mappatura sia:\n- Specifica per il contesto [cybersecurity enterprise]\n- Calibrata sul mio background attuale\n- Strutturata in modo da facilitare la prioritizzazione successiva\n- Comprensiva sia degli aspetti tecnici che di leadership",

  "scopo_en": "Skills mapping for a new role",
  "descrizione_en": "An inventory of the skills, frameworks, trends and regulations of the domain.",
  "testo_en": "Develop a complete map of the skills needed to excel in the role of [Executive VP Cybersecurity], taking into account my background in [IT management and certification].\n\n1. CORE TECHNICAL SKILLS\n   - Identify the 15-20 technical domains that are essential for this role\n   - For each domain, specify:\n\t* Fundamental concepts to master\n\t* Specialist terminology to acquire\n\t* Reference methodologies and frameworks\n\t* Required depth (overview/operational/expert)\n\n2. STRATEGIC AND MANAGERIAL SKILLS\n   - Identify 10-12 key leadership skills in this specific context\n   - For each skill, outline:\n\t* Practical applications in the role\n\t* Relevant decision-making frameworks\n\t* Metrics for assessing effectiveness\n\t* Best practices in this specific industry\n\n3. EMERGING TRENDS AND INNOVATIONS\n   - Identify 5-7 emerging developments with a potential impact on the role\n   - For each trend, specify:\n\t* Expected short/medium-term impact\n\t* Implications for company strategy\n\t* Main players and stakeholders involved\n\t* Resources for staying up to date\n\n4. REGULATION AND COMPLIANCE\n   - Identify the relevant regulatory frameworks and industry standards\n   - For each one, outline:\n\t* Fundamental requirements to understand\n\t* Direct operational implications\n\t* Implementation timeline/deadlines\n\t* Authoritative resources for further study\n\n5. CASE STUDIES AND BEST PRACTICES\n   - Identify 8-10 landmark cases in the industry\n   - For each case, highlight:\n\t* Context and challenges faced\n\t* Approaches adopted and results achieved\n\t* Key lessons that apply to my context\n\t* Sources for detailed further study\n\nMake sure the map is:\n- Specific to the [enterprise cybersecurity] context\n- Calibrated to my current background\n- Structured so as to make subsequent prioritization easier\n- Comprehensive, covering both technical and leadership aspects",

  "id": "IA-30",
  "categoria": "Apprendimento",
  "capitolo": "Cap. 7",
  "scopo": "Prioritizzazione delle competenze",
  "descrizione": "Pesa le competenze su impatto, urgenza e profondità.",
  "slug": "prioritizzazione-competenze",
  "tinyurl": "https://tinyurl.com/3y8s8cyh",
  "testo": "Utilizzando la mappatura delle competenze generata, sviluppa un piano di apprendimento strategicamente prioritizzato per il ruolo di [Executive VP Cybersecurity].\n\n1. ANALISI MULTI-CRITERIO\n   Valuta ciascuna competenza identificata secondo i seguenti parametri:\n   - Impatto operativo (1-10): Quanto questa competenza influisce sulla capacità di generare valore immediato\n   - Urgenza contestuale (1-10): Quanto rapidamente questa competenza sarà necessaria nel nuovo ruolo\n   - Profondità richiesta (1-5): Livello di padronanza necessario (1=familiarità, 5=expertise)\n   - Allineamento strategico (1-10): Quanto questa competenza supporta gli obiettivi strategici dell'organizzazione\n   - Trasferibilità dalle competenze esistenti (1-10): Quanto posso sfruttare la mia esperienza attuale\n\n2. STRATIFICAZIONE TEMPORALE\n   Organizza le competenze in tre categorie temporali:\n   - Competenze mission-critical (primi 30 giorni)\n   - Competenze ad alto impatto (primi 90 giorni)\n   - Competenze di approfondimento (sviluppo progressivo)\n\n   Per ciascuna categoria, crea un piano sequenziale che consideri le interdipendenze tra competenze.\n\n3. MODALITÀ DI APPRENDIMENTO\n   Per ogni competenza prioritaria, suggerisci la combinazione ottimale di:\n   - Risorse formative (libri, corsi, webinar, articoli)\n   - Modalità di apprendimento (lettura, audio, pratica, mentorship)\n   - Tempo stimato necessario per l'acquisizione\n   - Milestones di verifica dell'apprendimento\n\n4. BILANCIAMENTO DEL PORTFOLIO\n   Assicura che il piano complessivo:\n   - Bilanci competenze tecniche e manageriali\n   - Alterni modalità di apprendimento diverse\n   - Distribuisca il carico cognitivo in modo sostenibile\n   - Preveda momenti di consolidamento e riflessione\n\n5. ADATTAMENTO AL MIO CONTESTO SPECIFICO\n   Tenendo conto dei miei vincoli personali:\n   - 30-60 minuti di studio focalizzato al mattino (6 giorni su 7)\n   - 3 ore settimanali di apprendimento pratico\n   - Tempi di viaggio in auto (convertibili in audio learning)\n   - Micro-sessioni durante la giornata\n\nPresenta il piano in formato tabellare, con chiara indicazione di priorità, modalità e tempistiche.",
  "output": "",
  "output_url": "",
  "categoria_en": "Learning",
  "capitolo_en": "Chapter 7",
  "scopo_en": "Prioritizing skills",
  "descrizione_en": "Weighs skills by impact, urgency and depth.",
  "testo_en": "Using the skills map generated, develop a strategically prioritized learning plan for the role of [Executive VP Cybersecurity].\n\n1. MULTI-CRITERIA ANALYSIS\n   Assess each skill identified according to the following parameters:\n   - Operational impact (1-10): How much this skill affects the ability to generate immediate value\n   - Contextual urgency (1-10): How quickly this skill will be needed in the new role\n   - Required depth (1-5): Level of mastery needed (1=familiarity, 5=expertise)\n   - Strategic alignment (1-10): How much this skill supports the organization's strategic objectives\n   - Transferability from existing skills (1-10): How much I can leverage my current experience\n\n2. TIME LAYERING\n   Organize the skills into three time categories:\n   - Mission-critical skills (first 30 days)\n   - High-impact skills (first 90 days)\n   - In-depth skills (progressive development)\n\n   For each category, create a sequential plan that takes into account the interdependencies between skills.\n\n3. LEARNING METHODS\n   For each priority skill, suggest the optimal combination of:\n   - Learning resources (books, courses, webinars, articles)\n   - Learning methods (reading, audio, practice, mentorship)\n   - Estimated time needed to acquire it\n   - Milestones to verify learning\n\n4. PORTFOLIO BALANCE\n   Make sure the overall plan:\n   - Balances technical and managerial skills\n   - Alternates different learning methods\n   - Distributes the cognitive load sustainably\n   - Includes moments for consolidation and reflection\n\n5. ADAPTATION TO MY SPECIFIC CONTEXT\n   Taking into account my personal constraints:\n   - 30-60 minutes of focused study in the morning (6 days out of 7)\n   - 3 hours a week of hands-on learning\n   - Time spent driving (convertible into audio learning)\n   - Micro-sessions during the day\n\nPresent the plan in table form, with a clear indication of priorities, methods and timing.",
  "output_en": ""
 },

const CHAPS=["Introduzione", "Cap. 2", "Cap. 3", "Cap. 5", "Cap. 6", "Cap. 7", "Cap. 9"];
const UI={
 it:{intro:'<strong>Intelligenza Aumentata</strong> — di Emanuele Castagno. Tutti i prompt del libro: cerca, apri e copia. Alcuni includono un output di esempio.',
  foot:'Libreria prompt del libro <strong>Intelligenza Aumentata</strong>. I prompt sono spunti da adattare al tuo contesto — verifica sempre gli output.',
  title:'Intelligenza Aumentata — Prompt Library',search:'Cerca un prompt (titolo, scopo, testo)…',searchLbl:'Cerca',all:'Tutti',open:'▶ Clicca per aprire',out:'📄 Output di esempio',
  copy:'Copia',copied:'Copiato ✓',soon:"Testo in arrivo — consulta l'output completo:",chap:c=>c},

  foot:'Prompt library for the book <strong>Augmented Intelligence</strong>. The prompts are starting points to adapt to your context — always check the outputs.',
  title:'Augmented Intelligence — Prompt Library',search:'Search for a prompt (title, purpose, text)…',searchLbl:'Search',all:'All',open:'▶ Click to open',out:'📄 Sample output',

};
function pickLang(){
 try{const q=new URLSearchParams(location.search).get('lang');if(q==='it'||q==='en')return q;}catch(e){}
 try{const s=localStorage.getItem('ia-lang');if(s==='it'||s==='en')return s;}catch(e){}
 const n=((navigator.languages&&navigator.languages[0])||navigator.language||'it').toLowerCase();
 return n.startsWith('it')?'it':'en';
}
let lang=pickLang(),curChap="ALL",curQ="";
const list=document.getElementById('list'),count=document.getElementById('count'),filters=document.getElementById('filters'),search=document.getElementById('search');
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function F(p,k){return (lang==='en'&&p[k+'_en'])?p[k+'_en']:p[k];}
function promptbox(p){return `<div class="promptbox"><button class="copybtn" data-id="${esc(p.id)}">${UI[lang].copy}</button><pre>${esc(F(p,'testo'))}</pre></div>`;}
function outbox(p){
 if(!p.output && !p.output_url) return '';
 const o=F(p,'output');
 const inner = o
   ? `<div class="promptbox"><button class="copybtn" data-out="${esc(p.id)}">${UI[lang].copy}</button><pre>${esc(o)}</pre></div>`
   : `<p style="color:var(--text-light);font-size:.9rem">${UI[lang].soon}</p>`;
 return `<details class="outblock" id="${esc(p.slug)}-output"><summary>${UI[lang].out}</summary><div class="body">${inner}</div></details>`;
}
function openHash(scroll){
 if(!location.hash)return;
 let el=null;try{el=document.getElementById(decodeURIComponent(location.hash.slice(1)));}catch(e){}
 if(!el)return;const card=el.closest('.card');if(card)card.open=true;el.open=true;
 if(scroll)el.scrollIntoView({behavior:'smooth',block:'center'});
}
function render(scroll){
 const openIds=[...document.querySelectorAll('details[open]')].map(x=>x.id);
 const q=curQ.toLowerCase();
 const items=PROMPTS.filter(p=>{const okC=curChap==="ALL"||p.capitolo===curChap;
  const hay=[p.scopo,p.descrizione,p.categoria,p.testo,p.output,p.scopo_en,p.descrizione_en,p.categoria_en,p.testo_en,p.output_en].join(' ').toLowerCase();
  return okC&&(!q||hay.includes(q));});
 count.textContent=items.length+" prompt"+(curChap!=="ALL"?" · "+UI[lang].chap(curChap):"")+(q?' · "'+curQ+'"':"");
 list.innerHTML=items.map(p=>`
  <details class="card" id="${esc(p.slug)}">
   <summary>
    <div class="badges"><span class="badge chap">${esc(F(p,'capitolo'))}</span><span class="badge cat">${esc(F(p,'categoria'))}</span>${(p.output||p.output_url)?'<span class="badge out">＋ output</span>':''}</div>
    <h2>${esc(F(p,'scopo'))}</h2>
    <div class="desc">${esc(F(p,'descrizione'))}</div>
    <div class="hint">${UI[lang].open}</div>
   </summary>
   <div class="body">${promptbox(p)}${outbox(p)}<div class="meta">ID ${esc(p.id)}</div></div>
  </details>`).join('');
 openIds.forEach(id=>{const el=document.getElementById(id);if(el)el.open=true;});
 openHash(scroll);
}
function drawFilters(){
 filters.innerHTML=['ALL',...CHAPS].map(c=>`<button class="fbtn${c===curChap?' active':''}" data-c="${c}">${c==='ALL'?UI[lang].all:UI[lang].chap(c)}</button>`).join('');
}
function applyLang(){
 document.documentElement.lang=lang;
 document.title=UI[lang].title;
 document.getElementById('intro').innerHTML=UI[lang].intro;
 document.getElementById('foot').innerHTML=UI[lang].foot;
 search.placeholder=UI[lang].search;search.setAttribute('aria-label',UI[lang].searchLbl);
 document.querySelectorAll('.lbtn').forEach(b=>{b.classList.toggle('active',b.dataset.lang===lang);b.setAttribute('aria-pressed',b.dataset.lang===lang);});
 drawFilters();
}
document.querySelector('.lang').addEventListener('click',e=>{
 const b=e.target.closest('.lbtn');if(!b||b.dataset.lang===lang)return;
 lang=b.dataset.lang;
 try{localStorage.setItem('ia-lang',lang);}catch(err){}
 try{const u=new URL(location.href);u.searchParams.set('lang',lang);history.replaceState(null,'',u);}catch(err){}
 applyLang();render(false);
});
filters.addEventListener('click',e=>{if(e.target.classList.contains('fbtn')){curChap=e.target.dataset.c;drawFilters();render(false);}});
search.addEventListener('input',e=>{curQ=e.target.value;render(false);});
list.addEventListener('click',e=>{if(e.target.classList.contains('copybtn')){e.preventDefault();const isOut=!!e.target.dataset.out;const id=e.target.dataset.id||e.target.dataset.out;const p=PROMPTS.find(x=>x.id===id);const text=isOut?(F(p,'output')||''):(F(p,'testo')||'');const b=e.target;navigator.clipboard.writeText(text).then(()=>{b.textContent=UI[lang].copied;setTimeout(()=>b.textContent=UI[lang].copy,1500);});}});
if('scrollRestoration' in history)history.scrollRestoration='manual';
applyLang();render(true);window.addEventListener('hashchange',()=>render(true));
</script>
