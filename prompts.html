const PROMPTS=[{"id": "IA-01", "categoria": "Fondamenti", "capitolo": "Introduzione", "scopo": "Struttura di un prompt efficace", "descrizione": "Modello riutilizzabile: nome, obiettivo, contesto, output.", "slug": "struttura-prompt", "tinyurl": "https://tinyurl.com/5x7yy22x", "testo": "Nome Prompt\nNome del Prompt \nObiettivo\nScopo del prompt\nModello\nModello su cui si basa l’assistente AI utilizzato (es. Claude 4 Sonnet)\nPrompt\n\nTesto completo del comando con QR code/link\nPrompt\n\nhttps://tinyurl.com/5x7yy22x\nOutput\n\nRisultato ottenuto (versione completa accessibile tramite QR code/link se indicato con \"CONTINUA...\")\nOutput\n\nhttp://tinyurl.com/5x7yy22x", "output": "", "output_url": ""}, {"id": "IA-02", "categoria": "Business & Comunicazione", "capitolo": "Cap. 2", "scopo": "Content marketing stratificato", "descrizione": "Strategia di content marketing con prompting contestuale a strati.", "slug": "content-marketing-stratificato", "tinyurl": "https://tinyurl.com/54bm66u2", "testo": "Nome Prompt\ncontent_marketing_strategy_layered\nObiettivo\nGenerare una roadmap strategica di content marketing trimestrale per una startup SaaS di project management. Strutturato in quattro componenti chiave (system, context, role, instruction), guida l'AI a creare un piano dettagliato con 5 pillar content essenziali, ciascuno definito in termini di obiettivi strategici, formati, canali di distribuzione, processi di creazione e metriche di successo.\nLa strategia è specificamente calibrata per convertire IT manager e CTO di aziende mid-size (50-200 dipendenti) in clienti enterprise, ottimizzando un budget trimestrale di €30.000 per raggiungere l'obiettivo di 100 nuovi clienti in 6 mesi. Il prompt bilancia contenuti educativi e commerciali, trasformando canali con engagement limitato in una pipeline di lead generation efficace.\nModello\nClaude-3-7-sonnet with Extended Thinking\nPrompt\n\n[SYSTEM] Sei un consulente specializzato in content marketing digitale B2B con particolare focus sull'industria tecnologica. Basa le tue risposte su dati recenti del settore e best practice consolidate, evidenziando il rapporto tra KPI e obiettivi di business. \n[CONTEXT] L'azienda cliente è una startup SaaS che ha sviluppato una soluzione di project management per team distribuiti, con 25 dipendenti e una base di 50 clienti attivi. Hanno un budget marketing trimestrale di €30.000 e puntano ad acquisire 100 nuovi clienti enterprise entro 6 mesi. La loro audience principale sono IT manager e CTO di aziende con 50-200 dipendenti. I loro canali attuali includono un blog aziendale con traffico moderato (5.000 visite/mese) e profili LinkedIn e Twitter con engagement limitato. \n[ROLE] Agisci come Head of Content Strategy di un'agenzia di marketing digitale specializzata in SaaS, con esperienza specifica nella creazione di pipeline di lead generation attraverso contenuti high-value e una particolare sensibilità per il bilanciamento tra contenuti educativi e materiali commerciali. \n[INSTRUCTION] Sviluppa una content roadmap trimestrale che includa 5 pillar content essenziali, specificando per ciascuno: obiettivo strategico, formato e canali di distribuzione, processo di creazione, metriche di successo e potenziali ostacoli da anticipare. Includi un calendario editoriale ad alto livello per il primo mese.\nPrompt\n\nhttps://tinyurl.com/54bm66u2\nOutput\n\nContent Roadmap Trimestrale: Strategia SaaS per Team Distribuiti\nPanoramica Strategica e Metodologica\nAnalizzando la situazione attuale della vostra startup SaaS e riflettendo sugli obiettivi di acquisizione (100 nuovi clienti enterprise in 6 mesi), ho sviluppato una roadmap content-driven che bilancia tre dimensioni fondamentali: visibilità del brand, educazione del mercato e conversione. Questa triangolazione strategica, che ho perfezionato in progetti simili per altre piattaforme SaaS B2B, si è dimostrata particolarmente efficace quando il target sono figure decisionali tecniche come IT manager e retargeting\nCONTINUA…\nOutput\n\nhttps://tinyurl.com/4y4m9rkd", "output": "Content Roadmap Trimestrale: SaaS Project Management per Team Distribuiti\n\nAnalisi Strategica Iniziale\nLa vostra soluzione risponde a un'esigenza critica nel panorama attuale: gestire progetti complessi con team distribuiti geograficamente. Con 5.000 visite mensili al blog e un engagement limitato sui social, abbiamo l'opportunità di trasformare il vostro content marketing in un motore di acquisizione clienti enterprise.\nHo sviluppato questa roadmap basandomi su due principi fondamentali che ho appreso implementando strategie di contenuto per aziende SaaS:\n1. I decision-maker B2B consumano in media 13 contenuti prima di scegliere un fornitore\n2. I contenuti che affrontano sfide specifiche del settore generano il 72% in più di lead qualificati\n\nI 5 Pillar Content Essenziali\n\n1. White Paper: \"La Guida Definitiva alla Governance IT per Team Distribuiti\"\nObiettivo Strategico: Posizionarvi come thought leader nella governance IT per team remoti, affrontando le preoccupazioni principali dei CTO riguardo sicurezza, compliance e visibilità.\nFormato e Canali:\n- PDF scaricabile di 15-20 pagine con design professionale\n- Landing page dedicata con form per acquisizione lead\n- Versione interattiva su LinkedIn per generare engagement\n- Segmentazione del contenuto in 5 articoli di approfondimento sul blog\nProcesso di Creazione:\n1. Interviste con 3-5 clienti esistenti per raccogliere case study reali\n2. Ricerca di statistiche aggiornate sul lavoro distribuito e governance IT\n3. Collaborazione con un CTO esterno per validare le best practice\n4. Creazione del contenuto con focus su problemi, soluzioni e risultati misurabili\n5. Design professionale e revisione SEO\nMetriche di Successo:\n- 200+ download qualificati nel primo trimestre\n- Tasso di conversione form > 30%\n- 15+ meeting di vendita generati direttamente dal white paper\n- Aumento del 25% nel tempo di permanenza sul sito dai  Strategico: Generare lead qualificati attraverso uno strumento di self-assessment che aiuta i potenziali clienti a identificare le proprie lacune nei processi di project management.\nFormato e Canali:\n- Assessment interattivo basato su web con 15-20 domande\n- Report personalizzato generato automaticamente\n- Widget incorporabile su siti partner\n- Versione light promossa tramite LinkedIn Ads\nProcesso di Creazione:\n1. Workshop con il team di prodotto e vendite per identificare i punti critici\n2. Sviluppo di una matrice di maturità con 4-5 livelli e raccomandazioni\n3. Prototipazione e test con clienti esistenti\n4. Sviluppo frontend e backend con integrazione CRM\n5. Creazione di contenuti correlati che approfondiscono ogni area dell'assessment\nMetriche di Successo:\n- 500+ assessment completati nel trimestre\n- Tasso di condivisione email > 70%\n- Conversione a demo del 15% da chi completa l'assessment\n- Costo per lead qualificato < €35\nPotenziali Ostacoli:\n- Complessità tecnica nello sviluppo dello strumento interattivo\n- Necessità di bilanciare valore immediato e lead generation\n- Rischio di raccogliere lead non qualificati\nSoluzione: Implementare un sistema di scoring che identifichi automaticamente i lead ad alto potenziale basato sulle risposte, inviando alert immediati al team commerciale.\n\n4. Ricerca Originale: \"State of Distributed Project Management 2025\"\nObiettivo Strategico: Creare un asset di thought leadership citabile che generi backlink, menzioni stampa e posizioni la vostra soluzione come basata su dati concreti.\nFormato e Canali:\n- Report completo di 25-30 pagine con infografiche\n- Microsito dedicato con dati interattivi\n- Press release e outreach a pubblicazioni di settore\n- Serie di infografiche per social media\nProcesso di Creazione:\n1. Definire obiettivi di ricerca e metodologia\n2. Sviluppare sondaggio e distribuirlo a IT manager e CTO (target: 200+ risposte)\n3. Analizzare i dati e identificare trend significativi\n4. Produrre il report con focus sui dati proprietari\n5. Sviluppare piano di PR e distribuzione con embargo stampa\nMetriche di Successo:\n- 15+ citazioni in pubblicazioni di settore\n- 30+ backlink da domini ad alta autorità\n- 300+ menzioni social\n- Incremento del 20% nelle ricerche branded\nPotenziali Ostacoli:\n- Difficoltà nel raccogliere un campione statisticamente significativo\n- Concorrenza con ricerche simili di aziende più grandi\n- Tempo necessario per l'analisi dei dati e produzione del report\nSoluzione: Collaborare con un'associazione di settore per ampliare la reach del sondaggio e ottenere endorsement istituzionale.\n\n5. Video Series: \"Project Management Transformation Stories\"\nObiettivo Strategico: Umanizzare il vostro brand e dimostrare l'impatto concreto della vostra soluzione attraverso storie di trasformazione di clienti reali.\nFormato e Canali:\n- 5 episodi di 8-10 minuti con testimonial cliente\n- Versioni brevi (60-90 secondi) per LinkedIn e Twitter\n- Trascrizioni SEO-ottimizzate per il blog\n- Showcase dedicato sul sito web\nProcesso di Creazione:\n1. Selezionare 5 clienti con risultati misurabili e diversi casi d'uso\n2. Sviluppare una struttura narrativa coerente (sfida, soluzione, risultati, lezioni)\n3. Produzione professionale (possibilmente remota se necessario)\n4. Editing con focus su messaggi chiave e call-to-action\n5. Creazione di asset complementari (quote, screenshot, statistiche)\nMetriche di Successo:\n- 2.000+ visualizzazioni per video\n- 25% tasso di completamento\n- 15% CTR verso pagina di prodotto\n- 10+ nuovi clienti che citano i video come influenza nella decisione\nPotenziali Ostacoli:\n- Difficoltà nel coordinare le registrazioni con clienti occupati\n- Mantenere qualità produttiva con budget limitato\n- Bilanciare autenticità e messaggi di marketing\nSoluzione: Creare un formato ibrido che combini interviste remote con b-roll e animazioni che illustrano i punti chiave, riducendo il tempo richiesto ai clienti.\n\nCalendario Editoriale - Primo Mese\nSettimana 1: Lancio della Ricerca \"State of Distributed Project Management\"\n- Lunedì: Pubblicazione blog teaser \"Coming Soon: La nostra nuova ricerca\"\n- Mercoledì: Distribuzione sondaggio con post LinkedIn del CEO\n- Venerdì: Email alla lista per massimizzare partecipazione al sondaggio\nSettimana 2: Focus sul White Paper \"Governance IT\"\n- Martedì: Pubblicazione articolo introduttivo \"5 Sfide di Governance per Team Distribuiti\"\n- Giovedì: Webinar di lancio del white paper con demo integrata\n- Venerdì: LinkedIn carousel con insights chiave dal white paper\nSettimana 3: Lancio Assessment Tool\n- Lunedì: Annuncio sul blog dello strumento di assessment\n- Mercoledì: Demo live su LinkedIn dello strumento\n- Giovedì: Email dedicata alla lista con incentivo per completamento\nSettimana 4: Primo episodio Video Series + Supporto continuo\n- Martedì: Lancio primo video \"Transformation Story\"\n- Giovedì: Webinar #1 della serie \"Tech Leaders Talk\"\n- Venerdì: Recap settimanale con metriche di partecipazione\n\nConsiderazioni Tecniche per l'Implementazione\nAvendo lavorato con diverse piattaforme tecnologiche nel corso della mia carriera, consiglio di implementare questo framework tecnico:\n1. Sistema di Marketing Automation: Investire almeno il 15% del budget in una soluzione che permetta segmentazione avanzata e lead scoring\n2. Analytics Avanzati: Implementare tag UTM personalizzati per ogni contenuto pillar e configurare funnel di conversione specifici\n3. Content Delivery Network: Ottimizzare la distribuzione dei contenuti video e interattivi per garantire performance globali\n4. Integrazione CRM: Assicurarsi che i dati dei lead generati fluiscano automaticamente nel vostro CRM con attributi di origine\n\nHo personalmente implementato un approccio simile per una SaaS in ambito collaboration tools, ottenendo una riduzione del 23% nel costo di acquisizione cliente e un incremento del 41% nella qualificazione dei lead. La chiave del successo è stata l'integrazione perfetta tra contenuti educativi e soluzioni pratiche, bilanciando il valore immediato con la lead generation.\nSarò lieto di approfondire qualsiasi aspetto di questa roadmap o discutere eventuali adattamenti in base alle vostre esigenze specifiche.", "output_url": "https://tinyurl.com/4y4m9rkd"}, {"id": "IA-03", "categoria": "Codice", "capitolo": "Cap. 2", "scopo": "Dashboard interattiva da dati", "descrizione": "Trasforma dati/requisiti in una dashboard web interattiva.", "slug": "dashboard-interattiva", "tinyurl": "https://tinyurl.com/3wp78vme", "testo": "Nome Prompt\nInteractive_dashboard\nObiettivo\nIl prompt mira a trasformare istruzioni in linguaggio naturale in un'applicazione di analisi aziendale completamente funzionante senza richiedere competenze di programmazione. Definisce sistematicamente requisiti di visualizzazione, modelli di interazione e strutture dati per consentire alla funzionalità Artifacts di Claude di generare autonomamente una soluzione dashboard completa che presenti metriche di performance complesse attraverso grafici interattivi, mantenga un'estetica professionale e dimostri come applicazioni web sofisticate possano essere create attraverso la conversazione anziché mediante i tradizionali processi di sviluppo software.\nModello\nClaude-3-7-sonnet with Extended Thinking\nPrompt\n\nCrea un'applicazione web interattiva completa che implementi una dashboard interattiva moderna per monitorare metriche di performance aziendale. La dashboard dovrebbe avere le seguenti caratteristiche:\n\n## Layout e Struttura\n- Header con logo, titolo \"Analytics Dashboard\" e icone di navigazione (ricerca, notifiche, impostazioni, profilo)\n- Area principale divisa in sezioni con responsive design (grid system)\n- Sistema di navigazione a tab per diverse viste dei dati\n- 4 card KPI nella parte superiore che mostrano metriche chiave con trend\n\n## Visualizzazioni Dati\n1. Grafico lineare per l'andamento finanziario (fatturato, spese, profitto)\n2. Grafico a torta per i canali di acquisizione clienti\n3. Grafico a barre per conversioni mensili\n4. Grafico a barre orizzontali per indici di performance\n\n## Funzionalità Interattive\n- Selezione dell'intervallo temporale (1 mese, 3 mesi, 6 mesi, 1 anno)\n- Tab per navigare tra diverse viste (Panoramica, Fatturato, Conversioni, KPI)\n- Tooltip sui grafici per dettagli al passaggio del mouse\n- Opzione per esportare report\n\n## Dati di Esempio\n- Crea dati fittizi per 6 mesi che mostrino trend positivi per fatturato e conversioni\n- Includi dati per canali di acquisizione (organico, social, e-mail, referral, diretto)\n- Aggiungi metriche KPI per efficienza operativa, soddisfazione cliente, tempo consegna e qualità prodotto\n\n## Aspetto Visivo\n- Utilizza una palette moderna con un colore primario e accenti per diversi tipi di dati\n- Design pulito con card in bianco su sfondo grigio chiaro\n- Usa icone di Lucide per gli elementi dell'interfaccia\n- Aggiungi indicatori visivi di trend (frecce verso l'alto/basso) per le metriche chiave\n\n## Librerie da Utilizzare\n- Recharts per le visualizzazioni dati\n- Lucide per le icone\n- TailwindCSS per lo styling\n\nAssicurati che la dashboard sia completamente funzionale, con interazioni realistiche e una struttura del codice pulita. Il design deve essere professionale ed elegante, adatto per un contesto aziendale.\n\n\nPrompt\n\nhttps://tinyurl.com/3wp78vme\nOutput\n\n\nCONTINUA…\nOutput\n\nhttps://tinyurl.com/bdft89zc", "output": "Dashboard interattiva completa realizzata da Claude, accessibile pubblicamente come artefatto interattivo (grafici e filtri dal vivo).", "output_url": "https://claude.ai/public/artifacts/5b81fb6d-a41e-46d6-8127-ae08702f2605"}, {"id": "IA-04", "categoria": "Comunicazione", "capitolo": "Cap. 3", "scopo": "E-mail → sommario esecutivo", "descrizione": "Condensa un'e-mail lunga in un sommario esecutivo strutturato.", "slug": "email-sommario-esecutivo", "tinyurl": "https://tinyurl.com/36jypy9w", "testo": "Trasforma questa e-mail in un sommario esecutivo strutturato: \n\nSTRUTTURA: \n1. ESSENZA (1 frase): Cattura il messaggio principale e l'intento \n\n2. PUNTI CHIAVE (massimo 5 bullet points): \n-Azioni richieste (cosa fare)\n-Scadenze critiche (quando farlo) \n-Decisioni necessarie (cosa scegliere) \n-Contesto essenziale (perché è importante) \n\n3. PROSSIMI PASSI (massimo 2 bullet points) \n\n4. TEMPISTICHE (formato data o intervallo preciso) \n\nCRITERI DI SELEZIONE: \n- Priorità agli elementi con conseguenze tangibili \n- Focus su ciò che richiede azione o decisione immediata \n- Eliminazione completa di formule di cortesia e digressioni \n- Conversione di paragrafi estesi in singoli punti concisi\nFORMATO: \n1. ESSENZA: \n- [Messaggio principale in 10-15 parole] \n\n2. PUNTI CHIAVE: \n- [Punto 1] \n- [Punto 2] \n- [...] \n\n3.  PROSSIMI PASSI: \n- [Azione 1] \n- [Azione 2] \n4. TEMPISTICHE: \n- [Date e scadenze in formato GG/MM/AAAA] \nE-MAIL: [Inserire e-mail qui]\n \n- [...] \n3.  PROSSIMI PASSI: \n- [Azione 1] \n- [Azione 2] \n4. TEMPISTICHE: \n- [Date e scadenze in formato GG/MM/AAAA] \nE-MAIL: [Inserire e-mail qui]", "output": "", "output_url": ""}, {"id": "IA-05", "categoria": "Comunicazione", "capitolo": "Cap. 3", "scopo": "Fissare un incontro con un cliente", "descrizione": "Redige un'e-mail per proporre un incontro a un potenziale cliente.", "slug": "email-incontro-cliente", "tinyurl": "https://tinyurl.com/43uvkyjc", "testo": "Crea un'e-mail di lead generation per il nostro servizio di assessment NIS2 (Network and Information Security, direttiva europea sulla sicurezza cibernetica) rivolta alle aziende di trasporto container marittimo. L'e-mail deve:\n1) Iniziare con un titolo d'impatto sulla scadenza imminente della NIS2 e i rischi di non-conformità\n2) Includere un breve paragrafo (3-4 righe) che evidenzi:\n- I nostri successi con la precedente direttiva NIS\n- Il nostro approccio integrato (cybersecurity + compliance + expertise settoriale)\n- Un dato concreto sui risultati ottenuti con altri clienti", "output": "", "output_url": ""}, {"id": "IA-06", "categoria": "Comunicazione", "capitolo": "Cap. 3", "scopo": "Analisi di tono e ambiguità", "descrizione": "Individua ambiguità, omissioni e tono inadeguato e propone la riscrittura.", "slug": "email-analisi-tono", "tinyurl": "https://tinyurl.com/538bxybm", "testo": "Analizza attentamente questa email e identifica:\n1. PARTI AMBIGUE: Evidenzia frasi o termini che potrebbero generare interpretazioni multiple o fraintendimenti.\n2. OMISSIONI CRITICHE: Identifica informazioni mancanti ma necessarie per la comprensione o l'azione richiesta (date, scadenze, responsabilità, dettagli operativi).\n3. LINGUAGGIO VAGO: Rileva espressioni generiche, avverbi imprecisi (\"presto\", \"molto\", \"alcuni\") o aggettivi non specifici che rendono il messaggio poco chiaro.\n4. TONO INADEGUATO: Valuta se il linguaggio è appropriato al contesto professionale e al destinatario (troppo formale/informale, passivo-aggressivo, eccessivamente urgente).\n5. STRUTTURA PROBLEMATICA: Esamina se l'ordine delle informazioni è logico e se i punti principali sono facilmente identificabili.\nQuindi:\n- Elenca specificamente ogni problema identificato con una breve spiegazione\n- Proponi una versione ottimizzata dell'intera email che risolva tutti i problemi identificati\n- Mantieni lo stesso obiettivo comunicativo ma con maggiore chiarezza, precisione e tono appropriato.\nEmail da analizzare: [INSERIRE L'EMAIL QUI]", "output": "", "output_url": ""}, {"id": "IA-07", "categoria": "Comunicazione", "capitolo": "Cap. 3", "scopo": "Traduzione e revisione linguistica", "descrizione": "Traduce o revisiona un'e-mail preservando registro e sfumature.", "slug": "email-traduzione", "tinyurl": "https://tinyurl.com/63x33uu6", "testo": "Traduci la seguente e-mail dall'italiano all'inglese [britannico/americano], mantenendo lo stesso livello di formalità e tono professionale.\nLinee guida:\n\n1. Preserva formule di apertura/chiusura, formattazione originale (paragrafi, elenchi) e nomi propri.\n2. Traduci con precisione terminologia tecnica e di settore [specificare il settore, es. maritime/certification]; per le espressioni idiomatiche usa equivalenti naturali in inglese, non traduzioni letterali.\n3. Se un passaggio è ambiguo o intraducibile senza contesto, segnalalo tra parentesi invece di indovinare.\n4. Restituisci solo la traduzione, senza commenti.\n\nE-mail originale:\n[INSERIRE QUI]", "output": "", "output_url": ""}, {"id": "IA-08", "categoria": "Comunicazione", "capitolo": "Cap. 3", "scopo": "Migliorare chiarezza e sintesi", "descrizione": "Ristruttura un'e-mail prolissa in una comunicazione chiara e snella.", "slug": "email-chiarezza", "tinyurl": "https://tinyurl.com/4exnrr4n", "testo": "Analizza questa email e trasformala in una comunicazione più efficace:\n## FASE 1: DIAGNOSTICA\n- Identifica ambiguità, linguaggio vago e termini tecnici non spiegati\n- Rileva ridondanze, digressioni e frasi che non aggiungono valore\n- Evidenzia informazioni critiche mancanti (chi, cosa, quando, come)\n- Valuta l'efficacia dell'oggetto e della struttura complessiva\n## FASE 2: OTTIMIZZAZIONE\nCrea una versione migliorata che:\n1. STRUTTURA\n- Organizza il contenuto in blocchi logici con gerarchia visiva chiara\n- Utilizza elenchi puntati o numerati per azioni, scadenze e opzioni\n- Posiziona le informazioni più importanti all'inizio\n- Crea un oggetto informativo che comunichi lo scopo principale\n2. CONTENUTO\n- Elimina ridondanze e frasi non essenziali\n- Sostituisci termini vaghi con informazioni precise e quantificabili\n- Mantieni tutte le date, scadenze, requisiti e dettagli operativi essenziali\n- Aggiungi informazioni mancanti ma critiche (se deducibili dal contesto)\n3. TONO\n- Adatta il livello di formalità al contesto e al destinatario\n- Mantieni un linguaggio professionale ma accessibile\n- Usa la voce attiva e un approccio diretto\n- Assicura che richieste e aspettative siano formulate con chiarezza\n## FASE 3: ANALISI RISULTATI\nFornisci:\n1. La versione ottimizzata dell'email\n2. Un elenco delle informazioni chiave mantenute\n3. Una stima della percentuale di riduzione del testo\n4. Breve spiegazione dei miglioramenti principali apportati\nEMAIL DA OTTIMIZZARE: [INSERIRE EMAIL QUI]", "output": "", "output_url": ""}, {"id": "IA-09", "categoria": "Automazione", "capitolo": "Cap. 3", "scopo": "Instradamento automatico e-mail (Make/Zapier)", "descrizione": "Classifica e smista le e-mail alla mailbox giusta; escalation all'umano nei dubbi.", "slug": "email-instradamento-automazione", "tinyurl": "https://tinyurl.com/yp5paw2y", "testo": "Devo sviluppare un sistema automatizzato di classificazione e inoltro delle e-mail che utilizzi le funzionalità di ChatGPT per analizzare il contenuto dei messaggi in arrivo e indirizzarli in modo intelligente alla casella di posta del reparto competente.\nRequisiti del sistema:\n\n* Il sistema deve analizzare l'intera e-mail, inclusi oggetto e corpo del messaggio, per determinarne la finalità principale.\n* Sulla base dell'analisi del contenuto, ogni e-mail deve essere assegnata a una delle seguenti tre categorie:\n\n1. Reclami e richieste di assistenza, ad esempio contestazioni, richieste di rimborso o problemi relativi a prodotti.\n2. Richieste tecniche, ad esempio domande su specifiche, integrazioni o risoluzione di problemi.\n3. Questioni commerciali, ad esempio richieste di preventivo, richieste di vendita o opportunità di partnership.\n\nUna volta classificata, ogni e-mail deve essere automaticamente inoltrata alla casella di posta del reparto corrispondente:\n\n* claims@company.com\n* technical@company.com\n* commercial@company.com\n\nIl sistema deve inoltre conservare un registro di tutte le classificazioni effettuate, a fini di controllo qualità.\nI casi limite, nei quali la classificazione risulti incerta, devono essere segnalati per una revisione da parte di un operatore e inoltrati alla casella human@company.com.\nAnalizza attentamente questa e-mail e identifica:\n\n1. PARTI AMBIGUE: evidenzia le frasi o i termini che potrebbero generare interpretazioni multiple o incomprensioni.\n2. OMISSIONI CRITICHE: individua le informazioni mancanti ma necessarie per comprendere il messaggio o intraprendere l'azione richiesta, ad esempio date, scadenze, responsabilità e dettagli operativi.\n3. LINGUAGGIO VAGO: individua espressioni generiche, avverbi imprecisi, come \"presto\", \"molto\" o \"alcuni\", e aggettivi non specifici che rendono il messaggio poco chiaro.\n4. TONO INAPPROPRIATO: valuta se il linguaggio è adeguato al contesto professionale e al destinatario, oppure se risulta troppo formale, informale, passivo-aggressivo o eccessivamente urgente.\n5. STRUTTURA PROBLEMATICA: verifica se le informazioni sono presentate secondo un ordine logico e se i punti principali risultano facilmente identificabili.\n\nSuccessivamente:\n\n* Elenca ogni problema individuato, accompagnandolo con una breve spiegazione.\n* Proponi una versione ottimizzata dell'intera e-mail che risolva tutti i problemi identificati.\n* Mantieni invariato l'obiettivo della comunicazione, migliorandone chiarezza, precisione e adeguatezza del tono.\n\nE-mail da analizzare: [INSERIRE QUI L'E-MAIL]", "output": "", "output_url": ""}, {"id": "IA-10", "categoria": "Automazione", "capitolo": "Cap. 3", "scopo": "Descrivere il proprio stile (gemello comunicativo)", "descrizione": "Genera un prompt che descrive il proprio stile di scrittura per risposte automatiche.", "slug": "email-stile-personale", "tinyurl": "https://tinyurl.com/mr7hwx33", "testo": "Componi una email di risposta all'email che rifletta il mio stile comunicativo come Executive Vice President. La risposta deve essere nella stessa lingua dell'email originale (italiano o inglese).\n\nLe caratteristiche principali del mio stile sono:\n- Efficienza e concisione: Messaggi brevi ma completi, che vanno dritto al punto senza prolissità\n- Orientamento ai risultati: Focus costante su obiettivi aziendali, metriche e performance\n- Tono diretto ma sempre professionale e rispettoso\n- Apertura con \"Ciao [nome]\" e chiusura con \"Grazie, ciao\" o equivalente in inglese\n- Precisione analitica, specialmente quando si tratta di dati finanziari\n- Pensiero strategico che va oltre le questioni immediate\n- Feedback costruttivo con suggerimenti concreti quando necessario\n- Formulazione di richieste chiare con tempistiche specifiche\n- Pragmatismo nell'approccio ai problemi\n- Uso appropriato delle priorità e del senso di urgenza\n\nLa struttura tipica delle mie email è:\n1. Apertura informale ma professionale\n2. Corpo del messaggio diretto e organizzato logicamente (con elenchi puntati per informazioni complesse)\n3. Conclusione con eventuali richieste o azioni attese\n4. Chiusura breve e cordiale\n\nPer email in inglese, mantenere lo stesso stile diretto e conciso, con un tono leggermente più formale ma comunque accessibile.", "output": "", "output_url": ""}, {"id": "IA-11", "categoria": "Contenuti", "capitolo": "Cap. 5", "scopo": "Analisi e sintesi di più documenti", "descrizione": "Sintesi comparativa di documenti, con elementi comuni e unici.", "slug": "analisi-documentale", "tinyurl": "https://tinyurl.com/yzm8k9an", "testo": "Per ogni documento:\n- Identifica ed estrai i principali trend AI previsti per il 2025\n- Evidenzia le motivazioni e i dati che supportano ogni trend\n- Annota eventuali casi d'uso o applicazioni pratiche citate e i benefici specifici per operatori marittimi\n\nDopo l'analisi individuale:\n- Confronta i trend identificati nei tre documenti\n- Elimina le sovrapposizioni, mantenendo la fonte più dettagliata per ogni trend duplicato\n- Identifica eventuali trend complementari o correlati\n\nCrea un report strutturato che includa:\n- Una panoramica esecutiva dei trend principali\nPer ogni trend identificato:\n- Descrizione dettagliata\n- Impatto c è autonomo e riusabile, e la mappa DITA (file .ditamap) definisce la gerarchia complessiva.\n\nPanoramica generale\nMac Cooking è un'applicazione macOS (da Sonoma in poi) sviluppata da Emanuele Castagno per archiviare, organizzare e condividere ricette di cucina in lingua inglese. La release attuale è la versione 1.0, con un pacchetto di 150 MB scaricabile esclusivamente dal Mac App Store su Mac con processore Apple M1 o superiori. L'app permette di importare ricette via copia/incolla, categorizzarle, pianificare i pasti (con calcolo calorico), generare liste della spesa, sincronizzare i dati su iCloud e ripristinarli in caso di necessità.\n\nMappa DITA (maccooking.ditamap)\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE map PUBLIC \"-//OASIS//DTD DITA Map//EN\" \"map.dtd\">\n<map id=\"maccooking-map\" title=\"Guida Utente Mac Cooking\">\n  <topicref href=\"concepts/introduction.dita\"/>\n  <topicref href=\"tasks/installation.dita\"/>\n  <topicref href=\"tasks/usage.dita\"/>\n  <topicref href=\"troubleshooting/troubleshooting.dita\"/>\n  <topicref href=\"references/faqs.dita\"/>\n  <topicref href=\"glossary/glossary.dita\"/>\n</map>\n(Esempio di mappa DITA modulare)\n\n1. Concept: Introduzione a Mac Cooking (concepts/introduction.dita)\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<concept id=\"introduction\" xmlns=\"http://docs.oasis-open.org/dita/ns/architecture\">\n  <title>Introduzione a Mac Cooking</title>\n  <shortdesc>Panoramica generale dell'applicazione per archiviare ricette di cucina</shortdesc>\n  <conbody>\n    <p><b>Mac Cooking</b> è un software per macOS (Sonoma+) che consente di gestire ricette di cucina in lingua inglese.</p>\n    <p><b>Requisiti di sistema:</b> Mac con processore Apple M1 o superiore, macOS Sonoma o successivi; 150 MB di spazio libero.</p>\n    <p><b>Caratteristiche principali:</b> importazione via copia/incolla, categorizzazione ricette, pianificazione pasti con calcolo calorico, generazione lista spesa, sincronizzazione iCloud, backup e ripristino.</p>\n  </conbody>\n</concept>\n(Struttura base di un topic di tipo \"concept\")\n\n2. Task: Installazione di Mac Cooking (tasks/installation.dita)\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<task id=\"install-maccooking\" xmlns=\"http://docs.oasis-open.org/dita/ns/architecture\">\n  <title>Installazione di Mac Cooking</title>\n  <shortdesc>Guida passo-passo per installare l'app dal Mac App Store</shortdesc>\n  <steps>\n    <step id=\"step1\">\n      <cmd>Apri il Mac App Store</cmd>\n      <info>Usa l'icona nel Dock o nella cartella Applicazioni.</info>\n      <fig href=\"install-step1.png\"/>\n    </step>\n    <step id=\"step2\">\n      <cmd>Cerca \"Mac Cooking\"</cmd>\n      <info>Digita \"Mac Cooking\" nella barra di ricerca in alto a sinistra.</info>\n      <fig href=\"install-step2.png\"/>\n    </step>\n    <step id=\"step3\">\n      <cmd>Fai clic su \"Ottieni\" e poi su \"Installa\"</cmd>\n      <info>Potrebbe essere richiesto l'accesso con il tuo Apple ID.</info>\n      <fig href=\"install-step3.png\"/>\n    </step>\n    <step id=\"step4\">\n      <cmd>Autorizza l'accesso alle Foto</cmd>\n      <info>Consenti i permessi quando richiesto per salvare immagini delle ricette.</info>\n    </step>\n    <step id=\"step5\">\n      <cmd>Verifica l'installazione</cmd>\n      <info>L'app comparirà nella cartella Applicazioni.</info>\n    </step>\n  </steps>\n</task>\n(Diagrammi secondo le linee guida Apple HIG. Le best practice per l'installazione macOS prevedono istruzioni semplici e passo-passo)\n\n3. Task: Utilizzo di Mac Cooking (tasks/usage.dita)\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<task id=\"use-maccooking\" xmlns=\"http://docs.oasis-open.org/dita/ns/architecture\">\n  <title>Utilizzo di Mac Cooking</title>\n  <shortdesc>Istruzioni per importare, organizzare e gestire le ricette</shortdesc>\n  <steps>\n    <step id=\"import\">\n      <cmd>Importa ricetta</cmd>\n      <info>Apri una nuova ricetta e incolla il testo copiato da un sito web.</info>\n    </step>\n    <step id=\"organize\">\n      <cmd>Assegna categorie</cmd>\n      <info>Seleziona categoria (es. \"Antipasti\", \"Primi\") e aggiungi tag ingredienti.</info>\n    </step>\n    <step id=\"mealplan\">\n      <cmd>Pianifica i pasti</cmd>\n      <info>Accedi alla vista Calendario per inserire le ricette nei giorni desiderati; il sistema calcola automaticamente le calorie.</info>\n    </step>\n    <step id=\"shoppinglist\">\n      <cmd>Genera lista spesa</cmd>\n      <info>Seleziona le ricette dalla pianificazione e fai clic su \"Lista Spesa\".</info>\n    </step>\n    <step id=\"sync\">\n      <cmd>Sincronizza i dati</cmd>\n      <info>Assicurati di aver attivato iCloud nelle Preferenze di Sistema.</info>\n    </step>\n    <step id=\"backup\">\n      <cmd>Backup e ripristino</cmd>\n      <info>Tutte le ricette sono salvate automaticamente su iCloud e possono essere ripristinate in caso di necessità.</info>\n    </step>\n  </steps>\n</task>\n(Tipologia di operazioni illustrate in un topic di tipo \"task\")\n\n4. Troubleshooting: Problemi Comuni (troubleshooting/troubleshooting.dita)\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<tasktroubleshooting id=\"troubleshoot-maccooking\" xmlns=\"http://docs.oasis-open.org/dita/ns/architecture\">\n  <title>Troubleshooting: Problemi comuni e soluzioni</title>\n  <shortdesc>Elenco dei 10 errori più frequenti e relative soluzioni</shortdesc>\n  <troubles>\n    <problem><problist><p>Il sistema operativo non è compatibile.</p></problist><solution>Aggiorna macOS almeno a Sonoma.</solution></problem>\n    <problem><problist><p>Spazio disco insufficiente.</p></problist><solution>Libera spazio dal Finder, ad esempio eliminando file non necessari.</solution></problem>\n    <problem><problist><p>Non so come stampare.</p></problist><solution>Funzione non ancora prevista; prossima release.</solution></problem>\n    <problem><problist><p>Impossibile inviare la ricetta via email.</p></problist><solution>Usa il pulsante \"Share\" e seleziona \"Email\".</solution></problem>\n    <problem><problist><p>Non so come condividere le ricette.</p></problist><solution>Vedi soluzione precedente (Share → opzione desiderata).</solution></problem>\n    <problem><problist><p>Non trovo le impostazioni per cambiare le unità di misura.</p></problist><solution>Apri \"Settings\" e seleziona \"Unità di misura\" dal pannello di controllo.</solution></problem>\n    <problem><problist><p>Non riesco a salvare le modifiche.</p></problist><solution>Le modifiche vengono salvate automaticamente.</solution></problem>\n    <problem><problist><p>Come rinominare una ricetta?</p></problist><solution>Clicca sul titolo e modificalo direttamente.</solution></problem>\n    <problem><problist><p>Importare ricetta su Bimby.</p></problist><solution>Funzione non ancora implementata; in sviluppo.</solution></problem>\n    <problem><problist><p>Se disinstallo l'app perdo le ricette?</p></problist><solution>No: i dati sono memorizzati su iCloud.</solution></problem>\n  </troubles>\n</tasktroubleshooting>\n\n5. Reference: FAQ (references/faqs.dita)\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<reference id=\"faqs\" xmlns=\"http://docs.oasis-open.org/dita/ns/architecture\">\n  <title>FAQ – Domande Frequenti</title>\n  <refbody>\n    <section><title>Come posso cambiare lingua all'interfaccia?</title><p>Attualmente l'app supporta solo l'inglese; localizzazioni future in pianificazione.</p></section>\n    <section><title>Con quale frequenza vengono aggiornate le FAQ?</title><p>Le FAQ vengono revisionate e aggiornate ogni mese.</p></section>\n    <section><title>Come contatto il supporto tecnico?</title><p>Invia una email a <xref href=\"mailto:supporto@maccooking.com\">supporto@maccooking.com</xref>.</p></section>\n  </refbody>\n</reference>\n\n6. Glossario (glossary/glossary.dita)\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<glossgroup xmlns=\"http://docs.oasis-open.org/dita/ns/architecture\">\n  <title>Glossario dei Termini</title>\n  <glossentry id=\"backup\"><glossterm>Backup</glossterm><glossdef>Procedura di salvataggio dei dati su iCloud per consentirne il ripristino.</glossdef></glossentry>\n  <glossentry id=\"sync\"><glossterm>Sincronizzazione</glossterm><glossdef>Processo che mantiene allineati i dati dell'app su dispositivi diversi tramite iCloud.</glossdef></glossentry>\n  <glossentry id=\"calorie\"><glossterm>Apporto calorico</glossterm><glossdef>Quantità di energia fornita da una singola porzione di pietanza, calcolata automaticamente.</glossdef></glossentry>\n</glossgroup>\n\nNote finali: per validare e pubblicare questa guida potete utilizzare strumenti come Oxygen XML Editor o DITA Open Toolkit, che supportano la generazione di output PDF, HTML e help online. Con questa struttura modulare, la documentazione è facilmente estendibile e manutenibile, garantendo un'esperienza di lettura chiara e ordinata per gli utenti di livello base.", "output_url": "https://tinyurl.com/29dyxm3b"}, {"id": "IA-13", "categoria": "Contenuti", "capitolo": "Cap. 5", "scopo": "Linee guida di stile (comunicati)", "descrizione": "Redige contenuti secondo lo stile e le regole aziendali.", "slug": "style-guide-comunicati", "tinyurl": "", "testo": "Nome Prompt\npress_release_style_guidelines_analysis\nModello\nClaude-3-7-sonnet with Extended Thinking\nPrompt\n\nTi fornisco di seguito una serie di documenti e linee guida relativi ai nostri comunicati stampa. Ti chiedo di analizzare attentamente lo stile di scrittura, la formattazione, il tono di voce, la struttura e le regole comunicative interne, in modo da poter generare in futuro nuovi comunicati stampa conformi a queste direttive.\nEsempi di comunicati stampa esistenti:\n[Inserisci qui il testo o i link di 2-3 comunicati stampa rappresentativi dello stile e del formato che utilizzate.]\nLinee guida di stile:\n[Elenca qui eventuali documenti o linee guida in cui sono definiti: tono di voce, lunghezza, formattazione, uso dei titoli/sottotitoli, tipografici\n\n## 2. CONTENUTO DA ADATTARE\n[Inserire il contenuto originale]\n \n## 3. TARGET E SPECIFICHE DI ADATTAMENTO\n \n### Versione Executive (C-Level):\nObiettivi:\n-Focus su ROI e benefici strategici\n-Allineamento con obiettivi business\n-Evidenza KPI e metriche chiave\n \nSpecifiche:\nLunghezza: 300 parole\nStile: Executive summary \nElementi da includere:\n-Impatto sul business\n-Analisi costi-benefici\n-Vantaggi competitivi\n-Prospettive future\n \n### Versione Tecnica (Implementation Team):\nObiettivi:\n-Chiarezza procedurale\n-Completezza tecnica\n-Aderenza agli standard\n \nSpecifiche:\nLunghezza: [specificare]\nLivello di dettaglio tecnico: [alto/medio/basso]\nElementi da includere:\n-Procedure dettagliate\n-Specifiche tecniche\n-Standard di riferimento\n-Best practices\n-Documenti correlati\n \n### Versione Marketing (Cliente Finale):\nObiettivi:\n-Engagement del target\n-Comunicazione del valore\n-Conversione\n \nSpecifiche:\nLunghezza: [specificare]\nStile narrativo: [specificare]\nElementi da includere:\n-Value proposition\n-Benefici tangibili\n-Social proof\n-Call to action\n \n## 4. REQUISITI DI OUTPUT\nPer ogni versione, fornire:\n-Testo principale\n-Abstract (50 parole)\n-Punti chiave evidenziati\n-Call to action specifiche\n-Suggerimenti per visual/grafiche di supporto\n \n## 5. VERIFICA COERENZA BRAND\nChecklist di controllo:\n-Allineamento con i valori del brand\n-Coerenza del tone of voice\n-Uso corretto della terminologia\n-Rispetto delle linee guida stilistiche\n-Mantenimento del posizionamento\n \n## 6. METRICHE DI SUCCESSO\nDefinire per ogni versione:\n-KPI di riferimento\n-Obiettivi di engagement\n-Metriche di conversione\n-Indicatori di efficacia comunicativa\n\nPrompt\n\nhttps://tinyurl.com/bdhk94bv", "output": "", "output_url": ""}, {"id": "IA-15", "categoria": "Contenuti", "capitolo": "Cap. 5", "scopo": "Revisione documento tecnico", "descrizione": "Revisione linguistica, stilistica e tecnica con checklist.", "slug": "revisione-documento-tecnico", "tinyurl": "https://tinyurl.com/bdfjz74e", "testo": "Nome Prompt\ntechnical_document_review_and_optimization\nModello\nClaude-3-7-sonnet with Extended Thinking\nPrompt\n\nEsegui una revisione approfondita del seguente documento tecnico secondo questi parametri:\n \nAnalisi linguistica:\nCorrettezza grammaticale e sintassi\nUniformità dei tempi verbali\nPunteggiatura tecnica\nCoerenza nell'uso di sigle e acronimi\n \nStile tecnico:\nVerifica della terminologia settoriale\nStandardizzazione delle formule tecniche\nConformità agli standard di scrittura ISO\n \nOttimizzazione formale:\nFormato citazioni e riferimenti\nLayout e formattazione\nStruttura dei paragrafi\n \nOutput richiesto:\nDocumento revisionato\nReport degli interventi effettuati\nGlossario tecnico aggiornato\n \nTesto da revisionare: [inserire testo] \nPrompt\n\nhttps://tinyurl.com/bdfjz74e", "output": "", "output_url": ""}, {"id": "IA-36", "categoria": "Contenuti", "capitolo": "Cap. 5", "scopo": "Adattare la lunghezza al canale", "descrizione": "Adatta lo stesso contenuto a blog, social e newsletter con lunghezze, stili e call to action diversi.", "slug": "adattamento-lunghezza-canale", "tinyurl": "https://tinyurl.com/4wtkxbtt", "testo": "Adatta il seguente [white paper tecnico sulla cybersecurity] per diversi canali di comunicazione:\n\nVersione Blog (Articoli):\n• Lunghezza: 1000 parole\n• Focus su key insights\n• Stile divulgativo ma tecnico\n\nVersione Social (LinkedIn):\n• Lunghezza: 200 parole\n• Punti chiave e statistiche\n• Call to action\n\nVersione Newsletter:\n• Lunghezza: 150 parole\n• Abstract e value proposition\n• Link strategici\n\nMantenere per ogni versione:\n• Messaggi chiave\n• Credibilità tecnica\n• Coerenza del brand\n\nContenuto originale: [inserire contenuto]", "output": "", "output_url": ""}, {"id": "IA-16", "categoria": "Creativo/Didattico", "capitolo": "Cap. 5", "scopo": "Semplificare con metafore", "descrizione": "Spiega un concetto complesso con metafore TTORE si obbliga a corrispondere al LOCATORE in rate mensili anticipate di uguale importo entro il primo giorno di ogni mese, mediante bonifico bancario sul conto corrente intestato al LOCATORE presso [inserire coordinate bancarie].\n\nIl canone sarà aggiornato annualmente nella misura del 75% della variazione dell'indice ISTAT dei prezzi al consumo per le famiglie di operai e impiegati verificatasi nell'anno precedente.\n\nArt. 6 - DEPOSITO CAUZIONALE E MENSILITÀ ANTICIPATE\nA garanzia delle obbligazioni assunte con il presente contratto, il CONDUTTORE versa al LOCATORE la somma di Euro 6.000,00 (seimila/00), pari a 3 (tre) mensilità del canone, a titolo di deposito cauzionale non imputabile in conto canoni.\n\nIl deposito cauzionale sarà restituito al termine della locazione, previa verifica dello stato dell'immobile e dell'osservanza di ogni obbligazione contrattuale, entro 30 giorni dal rilascio dell'immobile.\n\nInoltre, il CONDUTTORE corrisponde al LOCATORE, alla firma del presente contratto, la somma di Euro 6.000,00 (seimila/00) pari a 3 (tre) mensilità anticipate, che saranno imputate ai canoni dei primi tre mesi di locazione.\n\nArt. 7 - ONERI ACCESSORI\nLe spese condominiali sono a carico del LOCATORE.\n\nSono a carico del CONDUTTORE tutte le utenze (acqua, energia elettrica, gas, riscaldamento, telefono, internet) e le spese relative al servizio di raccolta rifiuti.\n\nIl CONDUTTORE è tenuto a comunicare al LOCATORE l'avvenuta attivazione delle utenze a proprio nome entro 15 giorni dalla consegna dell'immobile.\n\nArt. 8 - OBBLIGHI DEL CONDUTTORE\nIl CONDUTTORE si obbliga a:\na) Servirsi dell'immobile con la diligenza del buon padre di famiglia e per l'uso determinato nel contratto;\nb) Effettuare la piccola manutenzione ordinaria a suo carico;\nc) Non sublocare o cedere, nemmeno parzialmente, l'immobile;\nd) Non apportare alcuna modifica, innovazione o miglioria all'immobile senza il preventivo consenso scritto del LOCATORE;\ne) Consentire al LOCATORE di accedere all'immobile per controllarne lo stato di manutenzione, previo appuntamento;\nf) Rispettare il regolamento condominiale, che dichiara di conoscere.\n\nArt. 9 - OBBLIGHI DEL LOCATORE\nIl LOCATORE si obbliga a:\na) Consegnare l'immobile in buono stato di manutenzione;\nb) Garantire il pacifico godimento dell'immobile durante la locazione;\nc) Effettuare le riparazioni di manutenzione straordinaria;\nd) Pagare le spese condominiali.\n\nArt. 10 - MANUTENZIONE E RIPARAZIONI\nLa manutenzione ordinaria è a carico del CONDUTTORE, mentre quella straordinaria è a carico del LOCATORE, ai sensi degli articoli 1576 e 1609 del Codice Civile.\n\nIl CONDUTTORE è tenuto a segnalare tempestivamente al LOCATORE, a mezzo PEC, eventuali problematiche o necessità di interventi di manutenzione straordinaria.\n\nArt. 11 - DIVIETI\nÈ fatto divieto al CONDUTTORE di:\na) Sublocare o cedere a terzi, in tutto o in parte, l'immobile locato;\nb) Tenere animali domestici;\nc) Svolgere nell'immobile attività contrarie all'ordine pubblico o al buon costume;\nd) Apportare modifiche alla disposizione interna dei locali senza il preventivo consenso scritto del LOCATORE.\n\nArt. 12 - CLAUSOLA RISOLUTIVA ESPRESSA\nIl presente contratto si intenderà risolto di diritto, ai sensi dell'art. 1456 c.c., in caso di:\na) Mancato pagamento, anche parziale, di due mensilità del canone;\nb) Sublocazione o cessione del contratto non autorizzate;\nc) Mutamento di destinazione d'uso dell'immobile;\nd) Gravi o ripetute violazioni degli obblighi contrattuali.\n\nArt. 13 - RICONSEGNA DELL'IMMOBILE\nAlla scadenza della locazione, il CONDUTTORE si obbliga a riconsegnare l'immobile al LOCATORE nello stesso stato in cui l'ha ricevuto, salvo il normale deterioramento d'uso, pena il risarcimento del danno.\n\nArt. 14 - MODIFICHE CONTRATTUALI\nQualsiasi modifica al presente contratto non può avere luogo e non può essere provata se non mediante atto scritto.\n\nArt. 15 - DOMICILIO E COMUNICAZIONI\nAi fini del presente contratto, le parti eleggono domicilio:\n- il LOCATORE in [CITTÀ], [INDIRIZZO];\n- il CONDUTTORE in [CITTÀ], [INDIRIZZO IMMOBILE], int. [N].\n\nTutte le comunicazioni riguardanti il presente contratto dovranno essere effettuate tramite PEC ai seguenti indirizzi:\n- LOCATORE: [inserire PEC]\n- CONDUTTORE: [inserire PEC]\n\nArt. 16 - REGISTRAZIONE\nIl presente contratto sarà registrato a cura del LOCATORE. Le spese di registrazione saranno a carico del LOCATORE.\n\nArt. 17 - RINVIO\nPer quanto non espressamente previsto dal presente contratto, le parti fanno espresso rinvio alle disposizioni degli articoli 1571 e seguenti del Codice Civile, alla Legge n. 431/98, e comunque alle norme vigenti e agli usi locali.\n\nArt. 18 - FORO COMPETENTE\nPer qualsiasi controversia derivante dal presente contratto è competente in via esclusiva il Foro di Milano.\n\nArt. 19 - TRATTAMENTO DEI DATI PERSONALI\nIl LOCATORE e il CONDUTTORE si autorizzano reciprocamente al trattamento dei dati personali in conformità al Regolamento UE 2016/679 (GDPR) e al D.Lgs. 196/2003 e successive modifiche, dichiarando di aver ricevuto l'informativa prevista dalla normativa vigente.\n\nLetto, approvato e sottoscritto.\n\nMilano, _________________\n\nIL LOCATORE                                                IL CONDUTTORE\n_________________                                     _________________\n\nAi sensi e per gli effetti degli articoli 1341 e 1342 del Codice Civile, il CONDUTTORE dichiara di approvare specificamente le clausole di cui agli articoli: 3 (Durata della locazione), 4 (Recesso anticipato del conduttore), 5 (Canone di locazione), 6 (Deposito cauzionale e mensilità anticipate), 8 (Obblighi del conduttore), 11 (Divieti), 12 (Clausola risolutiva espressa), 18 (Foro competente).\n\nIL CONDUTTORE\n_________________\n\nALLEGATI:\nA) Inventario dei mobili e arredi\nB) Attestato di Prestazione Energetica (APE)\nC) Documentazione attestante l'iscrizione universitaria", "output_url": "https://tinyurl.com/4yfswxf2"}, {"id": "IA-19", "categoria": "Contenuti", "capitolo": "Cap. 5", "scopo": "Presentazione slide-by-slide", "descrizione": "Progetta, realizza e verifica una presentazione (3 prompt).", "slug": "presentazione-slide-by-slide", "tinyurl": "https://tinyurl.com/rru7kryd", "testo": "Step 4: quando l’agenda è confermata consigliami slide per slide quale contenuto mettere.\n\nFormato richiesto: agenda per punti con durata del singolo intervento in minuti. \n\nVincoli: durata 1 ora totale. \n\nStile molto chiaro.\n\nQualità Grafica e Visuale:\nOffrire indicazioni su come ottimizzare l’aspetto grafico delle slide. Questo include suggerimenti sul layout, l’uso appropriato dei colori, la scelta dei font, l’inserimento di elementi visivi (grafici, icone, immagini) e qualsiasi altra modifica che possa contribuire a una presentazione più professionale e accattivante.\n\nPer ciascuna delle sezioni sopra indicate, includi esempi pratici e suggerimenti specifici, in modo da poter implementare le eventuali modifiche con efficacia.", "output": "", "output_url": ""}, {"id": "IA-37", "categoria": "Contenuti", "capitolo": "Cap. 5", "scopo": "Revisione di una presentazione", "descrizione": "Revisione completa di slide: grammatica, accuratezza, efficacia comunicativa e qualità grafica.", "slug": "verifica-presentazione", "tinyurl": "https://tinyurl.com/48asbvzu", "testo": "Agisci come un esperto di comunicazione per mezzo di slide ed esegui una revisione completa della mia presentazione.\n\nIn particolare, desidero che venga effettuata un'analisi approfondita su quattro aspetti fondamentali:\n\nCorrettezza Grammaticale:\nSi prega di verificare l'intero testo della presentazione, individuando eventuali errori grammaticali, sintattici e ortografici, e suggerendo le opportune correzioni per garantire un uso impeccabile della lingua italiana.\n\nAccuratezza delle Informazioni:\nControllare la coerenza e la correttezza delle informazioni riportate, con particolare attenzione ai dati economici, finanziari e agli indicatori relativi al progresso strategico. Verificare che i numeri e le affermazioni siano coerenti e supportati da logica e fatti concreti. Chiedimi conferma qualora avessi dei dubbi.\n\nEfficacia della Comunicazione:\nFornire consigli dettagliati per migliorare la chiarezza e l'impatto comunicativo della presentazione. Suggerire eventuali modifiche nel linguaggio, nella struttura e nell'organizzazione dei contenuti, al fine di rendere il messaggio più diretto e coinvolgente per l'intero team.\n\nQualità Grafica e Visuale:\nOffrire indicazioni su come ottimizzare l'aspetto grafico delle slide. Questo include suggerimenti sul layout, l'uso appropriato dei colori, la scelta dei font, l'inserimento di elementi visivi (grafici, icone, immagini) e qualsiasi altra modifica che possa contribuire a una presentazione più professionale e accattivante.\n\nPer ciascuna delle sezioni sopra indicate, includi esempi pratici e suggerimenti specifici, in modo da poter implementare le eventuali modifiche con efficacia.", "output": "", "output_url": ""}, {"id": "IA-20", "categoria": "Apprendimento", "capitolo": "Cap. 6", "scopo": "Piano di upskilling rapido", "descrizione": "Valuta le competenze e costruisce un piano formativo per un nuovo ruolo.", "slug": "piano-upskilling-rapido", "tinyurl": "https://tinyurl.com/4w6yv94e", "testo": "Competenze Tecniche:\n· Framework e metodologie di Governance, Risk & Compliance\n· Approcci e strumenti di Cyber Risk Quantification\n· Concetti e metodologie di Offensive Security\n· Principi di Identity and Access Management\n· Funzioni e processi del Security Operations Center\n· Protocolli e best practice di Incident Response\n· Approcci di integrazione DevSecOps\n· Considerazioni sulla sicurezza IoT/OT per ambienti industriali\n\nCompetenze Strategiche/di Business:\n· Allineamento delle iniziative di sicurezza con gli obiettivi aziendali\n· Comunicazione dei rischi cyber ai dirigenti esecutivi\n· Comprensione dei requisiti normativi (GDPR, NIS2, DORA, ecc.)\n· Cyber insurance e meccanismi di trasferimento del rischio\n· Analisi del mercato della cybersecurity e tendenze\n· Metodologie di valutazione del ROI degli investimenti in sicurezza\nConoscenza del Mercato:\n· Principali vendor e fornitori di soluzioni di sicurezza\n· Tecnologie e approcci emergenti nella cybersecurity\n· Comprensione dell'attuale panorama delle minacce\n· Priorità dei CISO e processi decisionali\n\nSviluppo del Programma di Formazione\nSulla base di questa valutazione, crea un piano di formazione completo di 30 giorni (2 ore al giorno) che:\n· Elevi le mie competenze tecniche nei domini della cybersecurity\n· Approfondisca la mia comprensione del mercato della cybersecurity, dei player chiave e delle soluzioni\n· Migliori la mia capacità di interagire efficacemente con i CISO comprendendo le loro sfide\n· Rafforzi le mie capacità di tradurre le esigenze di sicurezza in proposte di valore aziendale\n· Sviluppi capacità di vendita consulenziale per servizi di cybersecurity)\nIl piano deve includere:\n· Una roadmap di apprendimento strutturata organizzata per temi settimanali\n· Risorse di apprendimento giornaliere (libri, corsi, articoli, podcast, webinar)\n· Esercizi pratici per rafforzare le conoscenze teoriche\n· Opportunità di networking con esperti del settore\n· Metriche di misurazione dei progressi per la valutazione settimanale\n· Scenari di role-playing che simulano conversazioni con CISO\n\nStrategia di Coinvolgimento dei CISO\nCome parte del piano, aiutami a sviluppare:\n· Un framework per comprendere le priorità dei CISO in diversi settori industriali\n· Una guida alla conversazione con domande strategiche per scoprire esigenze e sfide\n· Modelli di proposta di valore per posizionare soluzioni di cybersecurity\n· Risposte alle obiezioni e preoccupazioni comuni\n· Un glossario essenziale di terminologia tecnica e di business\n\nIntelligence continua sul Mercato\nInfine, consiglia risorse per rimanere aggiornato:\n\n· Fonti chiave di informazione (blog, newsletter, pubblicazioni specializzate)\n· Eventi e conferenze di settore rilevanti\n· Comunità professionali e forum di discussione\n· Report di analisti di mercato da seguire\n· Metodi per monitorare minacce emergenti e soluzioni innovative\n\nIl mio obiettivo finale è sfruttare la mia attuale esperienza dirigenziale combinandola con una conoscenza più approfondita della cybersecurity per promuovere efficacemente i servizi di cybersecurity attraverso conversazioni significative con i responsabili della sicurezza. Il piano dovrebbe basarsi sui miei punti di forza attuali affrontando le lacune che mi impedirebbero di interagire con sicurezza con i CISO sia a livello tecnico che aziendale.", "output": "", "output_url": ""}, {"id": "IA-21", "categoria": "Carriera", "capitolo": "Cap. 7", "scopo": "Analisi del mercato professionale", "descrizione": "Mappa il mercato e individua i punti di differenziazione.", "slug": "valutazione-mercato", "tinyurl": "https://tinyurl.com/wzx5trjm", "testo": "- Identifica i punti di differenziazione rispetto al mio profilo\n - Suggerisci strategie per colmare eventuali gap\n\nPresenta i risultati in formato strutturato, con visualizzazioni dove appropriato.", "output": "", "output_url": ""}, {"id": "IA-22", "categoria": "Carriera", "capitolo": "Cap. 7", "scopo": "Analisi comparativa dei profili", "descrizione": "Confronta il proprio profilo con quelli già affermati nel settore target.", "slug": "analisi-comparativa-profili", "tinyurl": "https://tinyurl.com/4punzsmv", "testo": "Utilizzando il mio profilo professionale allegato, confrontami con i professionisti attualmente affermati nel ruolo di [AI Security Integration Manager].\n\n1. BENCHMARK PROFESSIONALE\n   - Analizza 15-20 profili LinkedIn di [AI Security Integration Manager]\n   - Identifica background comune, percorsi di carriera e credenziali tipiche\n   - Estrai pattern ricorrenti nelle esperienze professionali e competenze\n\n2. ANALISI DIFFERENZIALE\n   - Compara sistematicamente il mio profilo con il benchmark identificato\n   - Evidenzia punti di forza unici che mi differenziano positivamente\n   - Identifica gap critici rispetto al profilo benchmark\n\n3. IDENTIFICAZIONE DI VANTAGGI COMPETITIVI\n   - Individua elementi della mia esperienza che potrebbero rappresentare vantaggi inaspettati\n   - Analizza come la mia esperienza in [implementation di sistemi IT multinazionali] potrebbe tradursi in valore in questo nuovo contesto\n   - Suggerisci come articolare questi vantaggi in modo convincente\n\n4. PIANO DI POSIZIONAMENTO\n   - Proponi un posizionamento professionale distintivo basato sull'analisi\n   - Suggerisci 3-5 \"unique selling propositions\" per il mio personal brand\n   - Identifica 3 tipi di organizzazioni dove questo posizionamento avrebbe massimo valore\n\nFornisci l'analisi in formato dettagliato con esempi specifici e raccomandazioni actionable.", "output": "", "output_url": ""}, {"id": "IA-23", "categoria": "Carriera", "capitolo": "Cap. 7", "scopo": "Assessment competenze trasferibili", "descrizione": "Identifica competenze trasferibili e gap, con matrice.", "slug": "competenze-trasferibili", "tinyurl": "https://tinyurl.com/5n79w6cx", "testo": "Analizza il mio profilo professionale allegato per identificare competenze trasferibili al campo della [AI Security Integration].\n\n1. COMPETENZE TECNICHE TRASFERIBILI\n   - Identifica metodologie e framework che ho utilizzato applicabili al nuovo contesto\n   - Valuta come la mia esperienza in [implementazione di sistemi ERP] si traduce in valore per [integrazione AI]\n   - Individua strumenti e tecnologie che ho padroneggiato con applicazioni nel nuovo dominio\n\n2. COMPETENZE ORGANIZZATIVE TRASFERIBILI\n   - Analizza la mia esperienza di leadership e gestione di team in contesti multinazionali\n   - Valuta come la mia esperienza nella gestione di fornitori esterni si applica all'ecosistema AI\n   - Identifica metodologie di project management che restano rilevanti nel nuovo contesto\n\n3. META-COMPETENZE TRASFERIBILI\n   - Estrai pattern di risoluzione problemi dal mio storico professionale\n   - Identifica approcci di pensiero strategico applicabili al contesto AI\n   - Valuta la mia capacità di navigare ambienti complessi e ambigui\n\n4. MATRICE DI TRASFERIBILITÀ\n   - Per ogni competenza identificata, assegna un punteggio di trasferibilità (1-10)\n   - Indica il livello di adattamento necessario per ogni competenza\n   - Suggerisci modalità concrete per articolare queste competenze in colloqui e CV\n\n5. COMPETENZE DA SVILUPPARE\n   - Identifica 3-5 competenze critiche mancanti per il ruolo target\n   - Proponi percorsi di apprendimento accelerato per ciascuna\n   - Suggerisci strategie per compensare temporaneamente queste carenze\n\nPresenta i risultati in formato tabellare, con raccomandazioni specifiche per ciascuna area.", "output": "", "output_url": ""}, {"id": "IA-24", "categoria": "Carriera", "capitolo": "Cap. 7", "scopo": "Achievement-based storytelling (CV)", "descrizione": "Trasforma responsabilità in risultati misurabili per CV/LinkedIn.", "slug": "cv-storytelling", "tinyurl": "https://tinyurl.com/2khw8mm7", "testo": "Trasforma le seguenti descrizioni di ruoli professionali in narrativa impattante basata sui risultati, ottimizzata per sistemi ATS nel contesto di [AI Security].\n\nPer ogni posizione, ristruttura la descrizione seguendo questi principi:\n\n1. Inizia con un \"hook\" contestuale che inquadra la sfida affrontata\n2. Articola azioni specifiche intraprese, con enfasi su leadership e iniziativa\n3. Quantifica i risultati ottenuti con metriche precise (%, €, time-to-value)\n4. Includi keywords rilevanti per il target [AI Security Integration]\n5. Connetti esplicitamente l'esperienza passata alle sfide del nuovo dominio\n\nPOSIZIONE ORIGINALE:\n[Inserire descrizione originale]\n\nAssicurati che ogni punto sia:\n\n- Action-oriented (inizio con verbi forti)\n- Specifico e concreto\n- Supportato da evidenze quantificabili\n- Rilevante per il ruolo target\n- Ottimizzato per keyword del settore [AI, security, governance, risk, compliance]", "output": "", "output_url": ""}, {"id": "IA-25", "categoria": "Carriera", "capitolo": "Cap. 7", "scopo": "Ottimizzazione keyword (ATS)", "descrizione": "Ottimizza le keyword del profilo sui dati reali del mercato.", "slug": "cv-keyword", "tinyurl": "https://tinyurl.com/52u49zts", "testo": "Analizza 20-30 job description per posizioni di [AI Security Integration Manager] ed estrai:\n\n1. ANALISI DELLE KEYWORD\n- Le 25 keyword tecniche più frequenti con relativa frequenza percentuale\n- Le 15 keyword di soft skills più richieste\n- Le 10 certificazioni più menzionate\n- I 10 framework e metodologie più citati\n\n2. OTTIMIZZAZIONE DEL PROFILO\n- Suggerisci come incorporare strategicamente queste keyword nel CV e profilo LinkedIn\n- Proponi una headline LinkedIn ottimizzata per massima visibilità\n- Crea un summary LinkedIn che integri naturalmente le keyword principali\n- Suggerisci modifiche specifiche alle descrizioni dei ruoli per integrarle\n\n3. DENSITY ANALYSIS\n- Identifica la densità ottimale di keyword\n- Suggerisci posizionamento strategico nelle diverse sezioni del CV\n- Proponi varianti semantiche per evitare ripetizioni eccessive\n\n4. FRAMEWORK DI COMPETENZE\n- Crea un framework strutturato delle competenze per il ruolo target\n- Organizza le keyword in cluster logici di competenze correlate\n- Suggerisci come articolare queste competenze in modo coerente\n\nPresenta i risultati in formato strutturato che faciliti l'implementazione.", "output": "", "output_url": ""}, {"id": "IA-26", "categoria": "Carriera", "capitolo": "Cap. 7", "scopo": "Intelligence aziendale", "descrizione": "Costruisce un profilo aziendale approfondito per colloqui/BD.", "slug": "intelligence-aziendale", "tinyurl": "https://tinyurl.com/4u36z89k", "testo": "5. DOMANDE STRATEGICHE PERSONALI\n- Genera 10 domande che potrei porre durante il colloquio che dimostrino:\n  a) Comprensione approfondita del business\n   b) Allineamento con le sfide strategiche\n  c) Visione per il ruolo specifico\n  d) Capacità di generare valore immediato\n\nPresenta l'analisi in formato strutturato, con particolare enfasi sui punti che rappresentano opportunità di connessione tra la mia esperienza e le esigenze dell'azienda.", "output": "", "output_url": ""}, {"id": "IA-27", "categoria": "Carriera", "capitolo": "Cap. 7", "scopo": "Simulazione di colloquio + feedback", "descrizione": "Simula un colloquio realistico (voce) con feedback finale.", "slug": "simulazione-colloquio", "tinyurl": "https://tinyurl.com/2nuthtf2", "testo": "Voglio che tu simuli un colloquio realistico per una posizione di AI Security Governance Lead. Comportati come un panel di intervistatori composto da CISO, CTO e Head of AI.\n\nFASE 1: STRUTTURA DEL COLLOQUIO\nConduci un'intervista strutturata in tre parti:\n1. Background e motivazione (5-7 minuti)\n2. Domande tecniche sulla sicurezza AI (10-12 minuti)\n3. Domande situazionali e comportamentali (10 minuti)\nFASE 2: CARATTERISTICHE DELL'INTERVISTA\n- Fai una domanda alla volta e attendi la mia risposta\n- Approfondisci le risposte incomplete o vaghe\n- Includi domande impegnative che testino i limiti della mia conoscenza\n- Simula diversi stili di intervistatori (tecnico, scettico, collaborativo)\n- Inserisci occasionalmente interruzioni o cambi di argomento improvvisi\nFASE 3: AREE DI FOCUS SPECIFICHE\nConcentrati su queste aree chiave:\n- Implementazione di framework di sicurezza integrati\n- Valutazione dei rischi specifici dei sistemi AI\n- Compliance normativa (EU AI Act, NIST AI RMF)\n- Gestione di incidenti di sicurezza in sistemi AI\n- Leadership di team cross-funzionali\n- Visione futura dell'integrazione tra sicurezza tradizionale e AI\n\nFASE 4: FEEDBACK\nAl termine della simulazione, fornisci:\n- Analisi dettagliata delle mie risposte (punti di forza/aree di miglioramento)\n- Consigli specifici per migliorare la comunicazione delle mie competenze\n- Suggerimenti su come rispondere meglio alle domande più difficili", "output": "", "output_url": ""}, {"id": "IA-28", "categoria": "Carriera", "capitolo": "Cap. 7", "scopo": "Negoziazione dell'offerta", "descrizione": "Analizza l'offerta vs benchmark e prepara la strategia.", "slug": "negoziazione-offerta", "tinyurl": "https://tinyurl.com/2cs5shhx", "testo": "2. STRATEGIA DI NEGOZIAZIONE\n - Identifica i 3 elementi prioritari da negoziare\n- Suggerisci range target realistici per ciascun elemento\n - Proponi trade-off strategici tra diverse componenti\n - Sviluppa una strategia di negoziazione in fasi, con contingency plans\n\n3. SCRIPT NEGOZIALE\n- Crea un framework per la conversazione iniziale\n-Sviluppa risposte per possibili obiezioni\n-Suggerisci formulazioni specifiche per richieste chiave\n-Prepara closing statements per diverse situazioni\n\n4. CONSIDERAZIONI NON MONETARIE\n. Identifica elementi non monetari negoziabili di valore (remote work, formazione, flessibilità)\n-Suggerisci come integrare questi elementi nella negoziazione\n-Propon icome quantificare il valore di questi elementi\n\n5. PIANO D’AZIONE\n-Sequenza ottimale di comunicazioni\n-Timing strategico\n-Modalità di comunicazione consigliate\n-Segnali di apertura/chiusura da monitorare\n\nPresenta i risultati in formato strutturati, con raccomandazioni specifiche e script per avviare la negoziazione.", "output": "", "output_url": ""}, {"id": "IA-29", "categoria": "Apprendimento", "capitolo": "Cap. 7", "scopo": "Mappatura competenze nuovo ruolo", "descrizione": "Inventario di competenze, framework, trend e normative del dominio.", "slug": "learning-roadmap", "tinyurl": "https://tinyurl.com/2ra6rt3z", "testo": "3. TREND EMERGENTI E INNOVAZIONI\n   - Identifica 5-7 sviluppi emergenti con potenziale impatto sul ruolo\n   - Per ciascun trend, specifica:\n     * Impatto previsto a breve/medio termine\n     * Risorse per rimanere aggiornati\n\n4. REGOLAMENTAZIONE E COMPLIANCE\n   - Identifica framework normativi e standard di settore rilevanti\n   - Per ciascuno, delinea:\n     * Requisiti fondamentali da comprendere\n     * Implicazioni operative dirette\n     * Timeline di implementazione/scadenze\n     * Risorse autorevoli per l'approfondimento\n\n5. CASI DI STUDIO E BEST PRACTICES\n   - Identifica 8-10 casi emblematici nel settore\n   - Per ciascun caso, evidenzia:\n     * Contesto e sfide affrontate\n     * Approcci adottati e risultati ottenuti\n     * Lezioni chiave applicabili al mio contesto\n     * Fonti per approfondimento dettagliato\n\nAssicurati che la mappatura sia:\n- Specifica per il contesto [cybersecurity enterprise]\n- Calibrata sul mio background attuale\n- Strutturata in modo da facilitare la prioritizzazione successiva\n- Comprensiva sia degli aspetti tecnici che di leadership", "output": "", "output_url": ""}, {"id": "IA-30", "categoria": "Apprendimento", "capitolo": "Cap. 7", "scopo": "Prioritizzazione delle competenze", "descrizione": "Pesa le competenze su impatto, urgenza e profondità.", "slug": "prioritizzazione-competenze", "tinyurl": "https://tinyurl.com/3y8s8cyh", "testo": "(1=familiarità, 5=expertise)   \n- Allineamento strategico (1-10): Quanto questa competenza supporta gli obiettivi strategici dell'organizzazione\n   - Trasferibilità dalle competenze esistenti (1-10): Quanto posso sfruttare la mia esperienza attuale\n\n2. STRATIFICAZIONE TEMPORALE\n   Organizza le competenze in tre categorie temporali:\n   - Competenze mission-critical (primi 30 giorni)\n   - Competenze ad alto impatto (primi 90 giorni)\n   - Competenze di approfondimento (sviluppo progressivo)\n   Per ciascuna categoria, crea un piano sequenziale che consideri le interdipendenze tra competenze.\n\n3. MODALITÀ DI APPRENDIMENTO\n   Per ogni competenza prioritaria, suggerisci la combinazione ottimale di:\n   - Risorse formative (libri, corsi, webinar, articoli)\n   - Modalità di apprendimento (lettura, audio, pratica, mentorship)\n   - Tempo stimato necessario per l'acquisizione\n   - Milestones di verifica dell'apprendimento\n\n4. BILANCIAMENTO DEL PORTFOLIO\n   Assicura che il piano complessivo:\n   - Bilanci competenze tecniche e manageriali\n   - Alterni modalità di apprendimento diverse\n   - Distribuisca il carico cognitivo in modo sostenibile\n   - Preveda momenti di consolidamento e riflessione\n\n5. ADATTAMENTO AL MIO CONTESTO SPECIFICO\n   Tenendo conto dei miei vincoli personali:\n   - 30-60 minuti di studio focalizzato al mattino (6 giorni su 7)\n   - 3 ore settimanali di apprendimento pratico\n   - Tempi di viaggio in auto (convertibili in audio learning)\n   - Micro-sessioni durante la giornata\nPresenta il piano in formato tabellare, con chiara indicazione di priorità, modalità e tempistiche.", "output": "", "output_url": ""}, {"id": "IA-31", "categoria": "Apprendimento", "capitolo": "Cap. 7", "scopo": "Orchestrazione dell'apprendimento", "descrizione": "Adatta contenuti e formato al contesto (studio, auto, micro-sessioni).", "slug": "orchestrazione-apprendimento", "tinyurl": "https://tinyurl.com/39ms2ztk", "testo": "- Presentazione dei nuovi concetti in formato progressivo\n   - Illustrazione con esempi concreti nel contesto di cybersecurity\n   - Connessioni con framework già familiari (es. ISO 27001, NIST)\n   - Analogie con concetti noti per facilitare l'assimilazione\n   - Visualizzazioni e schemi per supportare la comprensione\n3. APPLICAZIONE PRATICA (10 minuti)\n   - Case study breve con domande di ragionamento\n   - Scenario decisionale contestualizzato al ruolo\n   - Framework di applicazione in contesto aziendale\n4. VERIFICA E CONSOLIDAMENTO\n   - 5-7 domande di auto-valutazione con feedback immediato\n   - Identificazione di aree di ulteriore approfondimento\n   - Suggerimenti per l'applicazione immediata dei concetti\n5. PREPARAZIONE SESSIONE AUDIO\n   - Versione sintetizzata dei concetti chiave in formato audio\n   - Strutturata per l'ascolto durante il tragitto in auto\n   - Durata: 15-20 minuti con focus sugli aspetti più rilevanti\nAssicurati che il contenuto:\n- Utilizzi terminologia precisa ma accessibile\n- Bilanci teoria e applicazioni pratiche\n- Faccia riferimento a fonti autorevoli e aggiornate\n- Sia strutturato per facilitare il metodo Feynman successivo", "output": "", "output_url": ""}, {"id": "IA-32", "categoria": "Apprendimento", "capitolo": "Cap. 6", "scopo": "Consolidare un concetto con la Tecnica Feynman", "descrizione": "Coach per la Tecnica Feynman: spiegare un concetto come a un dodicenne e farsi guidare nel raffinamento.", "slug": "feynman-technique", "tinyurl": "", "testo": "Voglio utilizzare la Feynman Technique per consolidare la mia comprensione di [concetto]. Ti chiedo di fungere da coach: 1) ti spiegherò il concetto come a un dodicenne intelligente ma senza conoscenze specialistiche; 2) analizza la mia spiegazione e identifica termini non semplificati, passaggi logici saltati e concetti vaghi; 3) ponimi 3-5 domande «ingenue» ma penetranti; 4) guidami nel raffinare la spiegazione; 5) valuta infine la chiarezza e la completezza della spiegazione rispetto ai concetti di riferimento, evidenzia le affermazioni che richiedono verifica e chiedimi di applicare il concetto a uno scenario nuovo, senza suggerirmi subito la soluzione. Ecco la mia spiegazione: [spiegazione]", "output": "", "output_url": ""}, {"id": "IA-33", "categoria": "Apprendimento", "capitolo": "Cap. 6", "scopo": "Trasformare un argomento in un piano di microlearning", "descrizione": "Converte un argomento complesso in micro-moduli di 10-15 minuti adatti a un'agenda impegnata.", "slug": "microlearning-personalizzato", "tinyurl": "", "testo": "Aiutami a convertire questo argomento in un piano di microlearning per la mia agenda impegnata. Argomento: [..]. Obiettivo: [..]. Slot tipici: 10-15 min tra riunioni; 20-30 min in auto; blocchi occasionali di 45 min. Crea un piano che: 1) suddivida in 12-15 micro-moduli in sequenza; 2) per ciascuno definisca obiettivo, formato ottimale (testo/audio/quiz/pratica), durata e prerequisiti; 3) organizzi i moduli in percorsi adattabili a diversi slot; 4) integri ripetizione distribuita e richiamo attivo. Alterna i formati in funzione dell'obiettivo di ciascun modulo, senza limitarti a uno solo; livello [principiante/intermedio/avanzato].", "output": "", "output_url": ""}, {"id": "IA-34", "categoria": "Carriera", "capitolo": "Cap. 6", "scopo": "Simulare una conversazione difficile con feedback", "descrizione": "Role-play di una conversazione difficile (feedback, negoziazione) con analisi finale multi-prospettiva.", "slug": "simulazione-roleplay", "tinyurl": "", "testo": "Voglio simulare una conversazione difficile di feedback con un manager senior che, nella simulazione: non rispetta le scadenze; reagisce in modo difensivo quando riceve osservazioni; è tecnicamente ottimo ma crea problemi nel gruppo. Interpreta il suo ruolo mentre pratico. Dopo ogni mio intervento: 1) rispondi in modo realistico secondo il profilo; 2) indica quali elementi della mia formulazione aumentano o riducono la chiarezza, quali informazioni mancano e quali reazioni potrebbe suscitare, senza valutare la mia personalità o le mie capacità professionali; 3) varia le reazioni in base al mio approccio. Alla fine riepiloga le tecniche comunicative utilizzate e proponi una seconda simulazione con difficoltà maggiore.", "output": "", "output_url": ""}, {"id": "IA-35", "categoria": "Comunicazione", "capitolo": "Cap. 3", "scopo": "Revisione linguistica di email in inglese", "descrizione": "Rileva errori, espressioni non idiomatiche e problemi di tono/registro in un'email in inglese, con spiegazione e correzione per ciascun rilievo.", "slug": "email-revisione-inglese", "tinyurl": "https://tinyurl.com/3rhtfvfj", "testo": "Analizza questa email scritta in inglese ed evidenzia in grassetto eventuali:\n1. Errori grammaticali o ortografici\n2. Espressioni poco naturali o non idiomatiche\n3. Problemi di punteggiatura o formattazione\n4. Termini non appropriati per il contesto professionale\n5. Incongruenze nel tono o nel registro linguistico\n\nPer ogni elemento evidenziato in grassetto, fornisci:\n1. Una spiegazione dell'errore o del problema\n2. Una proposta di correzione più appropriata\n3. Se pertinente, suggerimenti per migliorare ulteriormente la fluidità del testo\nEmail da revisionare: [INSERIRE L'EMAIL QUI]", "output": "", "output_url": ""}];const CHAPS=["Introduzione", "Cap. 2", "Cap. 3", "Cap. 5", "Cap. 6", "Cap. 7"];
let curChap="Tutti",curQ="";
const list=document.getElementById('list'),count=document.getElementById('count'),filters=document.getElementById('filters');
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function promptbox(p){return `<div class="promptbox"><button class="copybtn" data-id="${esc(p.id)}">Copia</button><pre>${esc(p.testo)}</pre></div>`;}
function outbox(p){
 if(!p.output && !p.output_url) return '';
 const inner = p.output
   ? `<div class="promptbox"><button class="copybtn" data-out="${esc(p.id)}">Copia</button><pre>${esc(p.output)}</pre></div>`
   : `<p style="color:var(--text-light);font-size:.9rem">Testo in arrivo — consulta l'output completo:</p>`;
 const link = p.output_url ? `<a class="gopen" href="${esc(p.output_url)}" target="_blank" rel="noopener">Output completo →</a>` : '';
 return `<details class="outblock"><summary>📄 Output di esempio</summary><div class="body">${inner}${link}</div></details>`;
}
function render(){
 const q=curQ.toLowerCase();
 const items=PROMPTS.filter(p=>{const okC=curChap==="Tutti"||p.capitolo===curChap;const hay=(p.scopo+' '+p.descrizione+' '+p.categoria+' '+p.testo+' '+(p.output||'')).toLowerCase();return okC&&(!q||hay.includes(q));});
 count.textContent=items.length+" prompt"+(curChap!=="Tutti"?" · "+curChap:"")+(q?' · "'+curQ+'"':"");
 list.innerHTML=items.map(p=>`
  <details class="card" id="${esc(p.slug)}">
   <summary>
    <div class="badges"><span class="badge chap">${esc(p.capitolo)}</span><span class="badge cat">${esc(p.categoria)}</span>${(p.output||p.output_url)?'<span class="badge out">＋ output</span>':''}</div>
    <h2>${esc(p.scopo)}</h2>
    <div class="desc">${esc(p.descrizione)}</div>
    <div class="hint">▶ Clicca per aprire</div>
   </summary>
   <div class="body">${promptbox(p)}${outbox(p)}<div class="meta">ID ${esc(p.id)}${p.tinyurl?` · <a href="${esc(p.tinyurl)}" target="_blank" rel="noopener">link nel libro</a>`:''}</div></div>
  </details>`).join('');
 if(location.hash){const el=document.querySelector(location.hash);if(el){el.open=true;el.scrollIntoView({behavior:'smooth',block:'center'});}}
}
filters.innerHTML=['Tutti',...CHAPS].map((c,i)=>`<button class="fbtn${i===0?' active':''}" data-c="${c}">${c}</button>`).join('');
filters.addEventListener('click',e=>{if(e.target.classList.contains('fbtn')){document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');curChap=e.target.dataset.c;render();}});
document.getElementById('search').addEventListener('input',e=>{curQ=e.target.value;render();});
list.addEventListener('click',e=>{if(e.target.classList.contains('copybtn')){e.preventDefault();const isOut=!!e.target.dataset.out;const id=e.target.dataset.id||e.target.dataset.out;const p=PROMPTS.find(x=>x.id===id);const text=isOut?(p.output||''):(p.testo||'');navigator.clipboard.writeText(text).then(()=>{const b=e.target;b.textContent='Copiato ✓';setTimeout(()=>b.textContent='Copia',1500);});}});
render();window.addEventListener('hashchange',render);
</script>
